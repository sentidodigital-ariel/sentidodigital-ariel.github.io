<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#1b1d21">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Señales">
<title>Señales de tránsito – Argentina</title>
<style>
  :root{--bg:#1b1d21;--panel:#272a30;--line:#3a3e46;--ink:#f3f1ea;--mute:#a5a9b3;
    --yellow:#ffd100;--ok:#2fbf71;--bad:#ef4b4b;--card:#f6f4ee;--cardink:#1b1d21}
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
    display:flex;justify-content:center;overflow:hidden;-webkit-user-select:none;user-select:none}
  .wrap{width:100%;max-width:440px;height:100%;display:flex;flex-direction:column;padding:14px 16px 18px}
  header{display:flex;align-items:center;justify-content:space-between;gap:10px;min-height:30px}
  h1{font-size:15px;font-weight:800;letter-spacing:.06em;text-transform:uppercase}
  h1 span{color:var(--yellow)}
  .back{background:none;color:var(--mute);font-size:14px;font-weight:700;padding:6px 0;display:none}
  .view{display:none;flex:1;min-height:0;flex-direction:column}
  .view.on{display:flex}
  button{font:inherit;border:0;border-radius:14px;padding:15px 10px;font-weight:800;font-size:16px;cursor:pointer;color:#fff}
  button:active{transform:scale(.98)}
  .pri{background:var(--yellow);color:#1b1d21;width:100%}
  .sec{background:var(--panel);border:1px solid var(--line);color:var(--ink);width:100%}
  /* inicio */
  #home{overflow-y:auto;padding-top:12px}
  .lead{color:var(--mute);font-size:14px;line-height:1.45;margin-bottom:14px}
  .lvl{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);
    border-left:6px solid var(--yellow);border-radius:14px;padding:13px 14px;margin-bottom:10px;color:var(--ink)}
  .lvl.lock{opacity:.5;border-left-color:var(--line)}
  .lvl.done{border-left-color:var(--ok)}
  .lvl b{font-size:17px;display:flex;justify-content:space-between;align-items:center}
  .lvl b em{font-style:normal;font-size:13px;color:var(--mute);font-weight:600}
  .lvl small{display:block;color:var(--mute);font-size:13px;font-weight:500;margin-top:3px}
  .meter{height:6px;border-radius:3px;background:var(--line);margin-top:9px;overflow:hidden}
  .meter i{display:block;height:100%;background:var(--yellow);border-radius:3px}
  .lvl.done .meter i{background:var(--ok)}
  .reset{background:none;color:var(--mute);font-size:12px;font-weight:500;text-decoration:underline;padding:10px;width:100%}
  /* juego */
  .stats{display:flex;gap:8px;margin-top:12px}
  .stat{flex:1;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
  .stat b{display:block;font-size:19px;font-variant-numeric:tabular-nums}
  .stat small{font-size:11px;color:var(--mute);text-transform:uppercase;letter-spacing:.07em}
  .bar{height:6px;border-radius:3px;margin-top:12px;position:relative;overflow:hidden;
    background:repeating-linear-gradient(90deg,var(--line) 0 14px,transparent 14px 22px)}
  .bar i{position:absolute;inset:0 auto 0 0;width:0;background:var(--yellow);border-radius:3px;transition:width .3s}
  .stage{flex:1;position:relative;margin:16px 0 14px;min-height:0}
  .card{position:absolute;inset:0;background:var(--card);color:var(--cardink);border-radius:22px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:18px;
    box-shadow:0 14px 34px rgba(0,0,0,.45);touch-action:none;cursor:grab;will-change:transform}
  .card.anim{transition:transform .28s ease-out,opacity .28s}
  .card svg{width:min(58%,220px);height:auto;flex-shrink:1;min-height:0}
  .cat{font-size:11px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:#6c6f76;margin-bottom:12px}
  .q{font-size:14px;color:#55585f;margin-top:16px}
  .name{font-size:22px;font-weight:800;text-align:center;line-height:1.2;margin-top:4px;text-wrap:balance}
  .name.long{font-size:17px}
  .stamp{position:absolute;top:22px;font-size:20px;font-weight:900;letter-spacing:.06em;padding:4px 10px;
    border:4px solid;border-radius:8px;opacity:0}
  .stamp.yes{left:18px;color:var(--ok);transform:rotate(-12deg)}
  .stamp.no{right:18px;color:var(--bad);transform:rotate(12deg)}
  .hint{text-align:center;font-size:13px;color:var(--mute);margin-bottom:10px}
  .btns{display:flex;gap:12px}
  .btns button{flex:1}
  .bno{background:var(--bad)} .byes{background:var(--ok)}
  .flash{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);font-size:30px;font-weight:900;
    color:var(--ok);pointer-events:none;opacity:0;transition:opacity .15s;white-space:nowrap}
  .flash.on{opacity:1}
  .sheet{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:5}
  .sheet.on{display:flex}
  .sheet>div{background:var(--panel);width:100%;max-width:440px;border-radius:22px 22px 0 0;padding:20px 18px 22px;
    border-top:4px solid var(--bad)}
  .sheet h2{font-size:18px;color:var(--bad);margin-bottom:12px}
  .rev{display:flex;gap:14px;align-items:center}
  .rev svg{width:84px;height:84px;flex-shrink:0;background:var(--card);border-radius:12px;padding:6px}
  .rev b{font-size:17px;display:block;margin-bottom:4px}
  .rev p{font-size:14px;color:var(--mute);line-height:1.4}
  .sheet button{margin-top:16px}
  /* fin y estudio */
  #end,#study{overflow-y:auto;padding-top:14px}
  .big{font-size:56px;font-weight:900;color:var(--yellow);font-variant-numeric:tabular-nums;line-height:1}
  .big.ok{color:var(--ok)} .big.bad{color:var(--bad)}
  #end h2{font-size:20px;margin-top:6px}
  #end p{color:var(--mute);font-size:14px;margin:6px 0 14px;line-height:1.45}
  #end button{margin-bottom:10px}
  h3{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute);margin:16px 0 8px}
  .miss{display:flex;gap:12px;align-items:center;background:var(--panel);border:1px solid var(--line);
    border-radius:12px;padding:8px;margin-bottom:8px}
  .miss svg{width:56px;height:56px;flex-shrink:0;background:var(--card);border-radius:8px;padding:4px}
  .miss b{font-size:15px;display:block}
  .miss span{font-size:12px;color:var(--mute);line-height:1.35;display:block;margin-top:2px}
  .tabs{display:flex;gap:6px;position:sticky;top:-14px;background:var(--bg);padding:8px 0;z-index:2}
  .tabs button{flex:1;padding:9px 4px;font-size:13px;background:var(--panel);border:1px solid var(--line);color:var(--mute)}
  .tabs button.on{background:var(--yellow);color:#1b1d21;border-color:var(--yellow)}
</style>
</head>
<body>
<div class="wrap">
  <header><h1>Señales <span>de tránsito</span></h1><button class="back" id="back">‹ Inicio</button></header>

  <section class="view on" id="home"></section>

  <section class="view" id="game">
    <div class="stats">
      <div class="stat"><b id="s1">0</b><small>Aciertos</small></div>
      <div class="stat"><b id="s2">0</b><small>Racha</small></div>
      <div class="stat"><b id="s3">0</b><small id="s3l">Aprendidas</small></div>
    </div>
    <div class="bar"><i id="prog"></i></div>
    <div class="stage" id="stage"><div class="flash" id="flash"></div></div>
    <div class="hint">← Incorrecto &nbsp;·&nbsp; deslizá la tarjeta &nbsp;·&nbsp; Correcto →</div>
    <div class="btns">
      <button class="bno" id="bno">✕ Incorrecto</button>
      <button class="byes" id="byes">✓ Correcto</button>
    </div>
  </section>

  <section class="view" id="end"></section>
  <section class="view" id="study"></section>
</div>

<div class="sheet" id="sheet"><div>
  <h2 id="shT"></h2>
  <div class="rev"><span id="shS"></span><div><b id="shN"></b><p id="shP"></p></div></div>
  <button class="pri" id="shB">Seguir</button>
</div></div>

<script>
const SIGNS=(()=>{const R='#d11f26',K='#111',W='#fff',B='#1456a8',Y='#ffd100',O='#f58220',G='#0a7a3d';
const st=(c,w)=>`fill="none" stroke="${c}" stroke-width="${w}" stroke-linecap="round" stroke-linejoin="round"`;
const at=(x,y,s,i,r=0)=>`<g transform="translate(${x} ${y}) rotate(${r}) scale(${s}) translate(-100 -100)">${i}</g>`;
const txt=(t,s,y,f=K,x=100)=>`<text x="${x}" y="${y}" font-size="${s}" font-weight="900" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" fill="${f}">${t}</text>`;
const head=(x,y,a,c=K,s=1)=>`<polygon transform="translate(${x} ${y}) rotate(${a}) scale(${s})" points="0,-20 -18,10 18,10" fill="${c}"/>`;
const ln=(d,w=14,c=K)=>`<path d="${d}" ${st(c,w)} style="stroke-linecap:butt"/>`;
/* ---------- carcasas ---------- */
const ring=x=>`<circle cx="100" cy="100" r="86" fill="${W}" stroke="${R}" stroke-width="20"/>${x}`;
const slash=`<line x1="42" y1="42" x2="158" y2="158" stroke="${R}" stroke-width="15"/>`;
const slash2=`<line x1="158" y1="42" x2="42" y2="158" stroke="${R}" stroke-width="15"/>`;
const proh=x=>ring(x+slash);
const bring=x=>`<circle cx="100" cy="100" r="86" fill="${B}" stroke="${R}" stroke-width="20"/>${x}`;
const dia=(x,f=Y)=>`<rect x="31" y="31" width="138" height="138" rx="12" transform="rotate(45 100 100)" fill="${f}" stroke="${K}" stroke-width="6"/>${x}`;
const tri=x=>`<polygon points="100,18 188,172 12,172" fill="${W}" stroke="${R}" stroke-width="16" stroke-linejoin="round"/>${x}`;
const blue=x=>`<rect x="22" y="10" width="156" height="180" rx="14" fill="${B}"/>${x}`;
const serv=x=>blue(`<rect x="38" y="32" width="124" height="124" rx="8" fill="${W}"/>`+at(100,94,.95,x));
const green=x=>`<rect x="8" y="42" width="184" height="116" rx="10" fill="${G}"/><rect x="14" y="48" width="172" height="104" rx="6" fill="none" stroke="${W}" stroke-width="3"/>${x}`;
const end=(x,c)=>`<circle cx="100" cy="100" r="92" fill="${W}" stroke="${K}" stroke-width="6"/>${x}<line x1="160" y1="40" x2="40" y2="160" stroke="${c}" stroke-width="20"/>`;
/* ---------- pictogramas (centrados en 100,100) ---------- */
const whl=(x,y,r,c,b)=>`<circle cx="${x}" cy="${y}" r="${r}" fill="${c}" stroke="${b}" stroke-width="3"/><circle cx="${x}" cy="${y}" r="${r*.35}" fill="${b}"/>`;
const car=(c,b)=>`<path fill="${c}" d="M48 116V101Q48 94 57 93L72 90 83 76Q86 72 92 72H116Q122 72 125 76L135 90 145 93Q152 94 152 101V116Z"/><path fill="${b}" d="M80 90L88 79H102V90ZM107 79H117L126 90H107Z"/>${whl(72,117,12,c,b)}${whl(130,117,12,c,b)}`;
const carRear=(c,b)=>`<path fill="${c}" d="M76 92L82 68H118L124 92Z"/><path fill="${b}" d="M84 88L88 74H112L116 88Z"/><rect x="68" y="90" width="64" height="30" rx="6" fill="${c}"/><rect x="72" y="118" width="14" height="14" fill="${c}"/><rect x="114" y="118" width="14" height="14" fill="${c}"/>`;
const truckRear=(c,b)=>`<rect x="70" y="56" width="60" height="64" rx="3" fill="${c}"/><rect x="74" y="118" width="16" height="16" fill="${c}"/><rect x="110" y="118" width="16" height="16" fill="${c}"/>`;
const moto=(c,b)=>`<circle cx="68" cy="116" r="14" ${st(c,7)}/><circle cx="134" cy="116" r="14" ${st(c,7)}/><path fill="${c}" d="M74 100L90 84H112L120 92 136 114H126L112 102 100 114H78Z"/><path ${st(c,6)} d="M120 92L114 76H102"/>`;
const bike=c=>`<circle cx="66" cy="114" r="17" ${st(c,5)}/><circle cx="134" cy="114" r="17" ${st(c,5)}/><path ${st(c,5)} d="M66 114L90 84H120L100 114H66M90 84L100 114M120 84L134 114M82 78H98M90 84L88 78M120 84L117 72H108"/>`;
const truck=(c,b)=>`<rect x="44" y="66" width="68" height="46" fill="${c}"/><path fill="${c}" d="M116 82H136L152 98V114H116Z"/><path fill="${b}" d="M122 88H134L143 98H122Z"/><rect x="44" y="110" width="108" height="5" fill="${c}"/>${whl(64,117,11,c,b)}${whl(134,117,11,c,b)}`;
const trailer=(c,b)=>`<rect x="66" y="68" width="88" height="42" fill="${c}"/>${whl(88,116,11,c,b)}${whl(134,116,11,c,b)}<path ${st(c,6)} d="M66 102H46"/><circle cx="44" cy="102" r="6" ${st(c,4)}/>`;
const ped=c=>`<circle cx="100" cy="58" r="11" fill="${c}"/><path ${st(c,11)} d="M100 76L98 106L84 140M98 106L114 138M100 80L82 100M100 80L118 98"/>`;
const horse=c=>`<path fill="${c}" d="M62 88Q62 80 72 80H118L128 62Q130 56 137 58L147 66Q150 70 145 75L136 72 132 92V100H66Q62 100 62 94Z"/><path ${st(c,6)} d="M70 98V134M84 98V134M116 98V134M128 98V134"/><path ${st(c,5)} d="M63 86Q52 92 54 110"/>`;
const cow=c=>`<path fill="${c}" d="M56 84Q56 76 66 76H126L134 72Q146 70 150 78V90Q150 97 142 97H136L132 104H60Q56 104 56 98Z"/><path ${st(c,4)} d="M137 72Q134 61 143 59M146 72Q150 63 157 65"/><path ${st(c,7)} d="M66 102V136M80 102V136M116 102V136M128 102V136"/><path fill="${c}" d="M92 104h16v7h-16z"/><path ${st(c,4)} d="M57 82Q48 88 50 104"/>`;
const rider=c=>horse(c)+`<circle cx="94" cy="42" r="9" fill="${c}"/><path ${st(c,9)} d="M94 54V80L104 102M94 60L114 70"/>`;
const cart=c=>at(132,106,.6,horse(c))+`<rect x="34" y="84" width="48" height="20" fill="${c}"/><circle cx="58" cy="114" r="16" ${st(c,6)}/><path ${st(c,5)} d="M82 98H100"/>`;
const handcart=c=>`<path fill="${c}" d="M70 80H136L128 108H78Z"/><circle cx="103" cy="122" r="13" ${st(c,6)}/><path ${st(c,6)} d="M70 84L46 72M82 108L66 132"/>`;
const tractor=(c,b)=>`<path fill="${c}" d="M96 88H150V114H100Z"/><path ${st(c,6)} d="M62 88V58H98V88"/><path ${st(c,6)} d="M136 88V66"/>${whl(76,110,25,c,b)}${whl(138,121,14,c,b)}`;
const bus=(c,b)=>`<rect x="42" y="64" width="116" height="50" rx="8" fill="${c}"/>${[50,74,98,122].map(x=>`<rect x="${x}" y="72" width="18" height="17" fill="${b}"/>`).join('')}${whl(68,116,11,c,b)}${whl(132,116,11,c,b)}`;
const horn=c=>`<path fill="${c}" d="M60 90H80L122 66V134L80 110H60Z"/><circle cx="54" cy="100" r="12" fill="${c}"/><path ${st(c,5)} d="M132 84Q144 100 132 116"/>`;
const chains=(c,b)=>`<circle cx="100" cy="100" r="36" ${st(c,22)}/>${[0,1,2,3,4,5,6,7].map(i=>`<path transform="rotate(${i*45} 100 100)" stroke="${b}" stroke-width="3.5" d="M91 55L109 73M109 55L91 73"/>`).join('')}`;
const plane=c=>`<path fill="${c}" d="M100 46Q107 54 107 70V84L148 108V120L107 108V130L120 140V148L100 142 80 148V140L93 130V108L52 120V108L93 84V70Q93 54 100 46Z"/>`;
const loco=(c,b)=>`<rect x="58" y="84" width="66" height="28" rx="4" fill="${c}"/><rect x="112" y="62" width="36" height="50" fill="${c}"/><rect x="120" y="70" width="20" height="15" fill="${b}"/><path fill="${c}" d="M68 84V66H62L60 58H88L86 66H80V84ZM58 110L42 130H58Z"/>${whl(72,122,11,c,b)}${whl(100,122,11,c,b)}${whl(132,122,11,c,b)}`;
const kids=c=>at(82,98,.82,ped(c))+at(124,108,.62,ped(c))+`<rect x="134" y="104" width="12" height="15" fill="${c}"/>`;
const kidball=c=>at(88,100,.8,ped(c))+`<circle cx="136" cy="128" r="10" fill="${c}"/>`;
const cyclist=c=>at(100,112,.9,bike(c))+`<circle cx="106" cy="54" r="9" fill="${c}"/><path ${st(c,8)} d="M90 90L100 66L116 80"/>`;
const wind=c=>`<path ${st(c,8)} d="M86 142Q90 112 108 94"/><ellipse cx="120" cy="80" rx="26" ry="15" transform="rotate(-32 120 80)" fill="${c}"/><path ${st(c,5)} d="M44 66H82M40 86H76M46 106H74"/>`;
const slip=(c,b)=>at(100,82,.95,carRear(c,b),-12)+`<path ${st(c,5)} d="M84 116Q74 126 86 134T86 152M114 112Q104 122 116 130T116 148"/>`;
const stones=(c,b)=>at(112,98,.8,car(c,b))+`<circle cx="58" cy="114" r="6" fill="${c}"/><circle cx="46" cy="98" r="5" fill="${c}"/><circle cx="62" cy="90" r="4" fill="${c}"/><circle cx="42" cy="120" r="4" fill="${c}"/>`;
const rocks=c=>`<path fill="${c}" d="M56 146V56H82L96 82 86 104 102 124 96 146Z"/><circle cx="118" cy="92" r="9" fill="${c}"/><circle cx="134" cy="118" r="11" fill="${c}"/><circle cx="114" cy="132" r="7" fill="${c}"/><circle cx="146" cy="140" r="6" fill="${c}"/>`;
const tunnel=c=>`<path fill="${c}" d="M50 142V96A50 50 0 0 1 150 96V142H130V98A30 30 0 0 0 70 98V142Z"/>`;
const narrowBridge=c=>`<path ${st(c,9)} d="M70 52L84 68V132L70 148M130 52L116 68V132L130 148"/>`;
const drawbridge=c=>`<path ${st(c,9)} d="M44 112H84L114 78M156 112H130"/><path fill="${c}" d="M76 112h12v22h-12zM126 112h12v22h-12z"/><path ${st(c,4)} d="M50 146q8 -8 16 0t16 0M112 146q8 -8 16 0t16 0"/>`;
const cross=`<path fill="${R}" d="M85 60h30v25h25v30h-25v25h-30v-25h-25v-30h25z"/>`;
const phone=(c,b)=>`<path ${st(c,15)} d="M68 80Q100 56 132 80"/><path fill="${c}" d="M74 98H126L138 138H62Z"/><circle cx="100" cy="118" r="10" fill="${b}"/>`;
const pump=(c,b)=>`<rect x="66" y="58" width="46" height="74" rx="4" fill="${c}"/><rect x="74" y="66" width="30" height="20" fill="${b}"/><rect x="60" y="132" width="58" height="9" fill="${c}"/><path ${st(c,6)} d="M112 86h12v36a7 7 0 0 0 14 0V78l-10 -10"/>`;
const wrench=(c,b)=>`<path ${st(c,15)} d="M72 136L116 84"/><circle cx="124" cy="74" r="19" fill="${c}"/><path fill="${b}" transform="rotate(40 124 74)" d="M118 50h12v22h-12z"/>`;
const bed=c=>`<path fill="${c}" d="M48 64h9v40h86V92q0 -10 -10 -10H90v18H57M48 64v74h9V116h86v22h9V104H48"/><circle cx="72" cy="90" r="9" fill="${c}"/>`;
const cutlery=c=>`<path ${st(c,5)} d="M66 58V82Q66 94 77 94Q88 94 88 82V58M77 58V140"/><path fill="${c}" d="M116 58Q136 70 134 104H125V142H116Z"/>`;
const tent=(c,b)=>`<path fill="${c}" d="M100 58L150 138H50Z"/><path fill="${b}" d="M100 98L116 138H84Z"/>`;
const tire=c=>`<circle cx="100" cy="100" r="34" ${st(c,18)}/><circle cx="100" cy="100" r="9" fill="${c}"/>`;
const umbrella=c=>`<path fill="${c}" d="M50 98A50 42 0 0 1 150 98Z"/><path ${st(c,6)} d="M100 56V134"/><path ${st(c,5)} d="M52 142q8 -8 16 0t16 0 16 0 16 0 16 0"/>`;
const envelope=c=>`<rect x="54" y="70" width="92" height="60" ${st(c,7)}/><path ${st(c,7)} d="M54 70L100 108L146 70"/>`;
const museum=c=>`<path fill="${c}" d="M50 84L100 56L150 84Z"/>${[60,83,107,130].map(x=>`<rect x="${x}" y="90" width="10" height="38" fill="${c}"/>`).join('')}<rect x="52" y="130" width="96" height="10" fill="${c}"/>`;
const cup=c=>`<path fill="${c}" d="M62 76H122V102Q122 126 92 126Q62 126 62 102Z"/><path ${st(c,7)} d="M122 84Q142 84 140 97Q138 110 120 108M56 138H130"/>`;
const tree=c=>`<circle cx="100" cy="84" r="30" fill="${c}"/><rect x="94" y="106" width="12" height="34" fill="${c}"/><path ${st(c,6)} d="M62 140H138"/>`;

add(1,IN,'serv','Restaurante',serv(cutlery(K)),'Cubiertos: lugar para comer.');
add(2,IN,'serv','Campamento',serv(tent(K,W)),'Carpa: zona de camping.');
add(1,IN,'serv','Aeropuerto',serv(plane(K)),'Avión en señal azul: hay un aeropuerto (no es un peligro).');
add(3,IN,'serv','Gomería',serv(tire(K)),'Neumático: reparación de cubiertas.');
add(2,IN,'serv','Balneario',serv(umbrella(K)),'Sombrilla y agua: playa o balneario.');
add(2,IN,'serv','Correo',serv(envelope(K)),'Sobre: oficina de correo.');
add(3,IN,'serv','Museo',serv(museum(K)),'Edificio con columnas: museo.');
add(2,IN,'serv','Bar',serv(cup(K)),'Taza: bar o cafetería.');
add(3,IN,'serv','Plaza',serv(tree(K)),'Árbol: plaza o espacio verde.');
add(3,IN,'serv','Casas rodantes',serv(caravan(K,W)),'Lugar para casas rodantes.');
add(2,IN,'serv','Terminal de ómnibus',serv(bus(K,W)),'Colectivo en señal azul de servicios: terminal.');
add(2,IN,'serv','Estación de ferrocarril',serv(loco(K,W)),'Locomotora en señal azul de servicios: estación de tren.');
add(2,IN,'serv','Taxi',serv(txt('TAXI',38,113)),'Parada de taxis.');

/* ===== TRANSITORIAS ===== */
add(1,TR,'obra','Hombres trabajando',dia(d(worker(K),.8),O),'Naranja = obra en la vía. Hay gente trabajando: bajar la velocidad.');
add(2,TR,'obra','Banderillero',dia(d(flagger(K),.8),O),'Una persona con bandera regula el paso más adelante.');
add(3,TR,'obra','Equipo pesado en la vía',dia(d(dozer(K,O),.76),O),'Hay máquinas viales trabajando.');
add(3,TR,'obra','Estrechamiento por obra',dia(ln('M72 152V112L88 84V48',10)+ln('M128 152V112L112 84V48',10),O),'Igual que el estrechamiento, pero naranja: es transitorio, por una obra.');
add(1,TR,'obra','Desvío',`<rect x="10" y="50" width="180" height="100" rx="8" fill="${O}" stroke="${K}" stroke-width="5"/>${txt('DESVÍO',34,92)}`+ln('M50 122H132',10)+head(142,122,90,K,.65),'Hay que tomar otro camino por una obra.');
add(2,TR,'obra','Calle o carretera cerrada',`<rect x="14" y="62" width="172" height="40" fill="${W}" stroke="${K}" stroke-width="3"/>${[0,1,2,3].map(i=>`<path d="M${20+i*38} 102l22 -40h22l-22 40z" fill="${O}"/>`).join('')}<path ${st(K,7)} d="M40 102V160M160 102V160M26 160H54M146 160H174"/>`,'Valla con franjas naranjas y blancas: no se puede pasar.');

/* ===== SEMÁFOROS Y CORDONES ===== */
add(1,SC,'sem','Luz roja: detenerse antes de la línea o senda',sem(1,0,0),'Con rojo no se avanza.');
add(2,SC,'sem','Luz amarilla: detenerse, salvo que ya no se alcance a frenar',sem(0,1,0),'El amarillo no es para acelerar: si podés frenar, frenás.');
add(3,SC,'sem','Amarillo intermitente: circular con precaución',sem(0,1,0,[0,45,90,135,180,225,270,315].map(a=>`<path transform="rotate(${a} 100 100)" stroke="${Y}" stroke-width="5" d="M100 70V60"/>`).join('').replace(/#ffd100/g,'#b58900')),'Titila: se puede pasar, con cuidado.');
add(3,SC,'sem','Flecha verde: solo se puede ir en esa dirección',sem(0,0,0,`<circle cx="100" cy="148" r="19" fill="#0d3"/>`+ln('M114 148H92',6,K)+head(86,148,-90,K,.45)),'La flecha verde habilita únicamente ese giro.');
add(2,SC,'cordon','Cordón amarillo: prohibido estacionar',curb(Y),'Cordón amarillo: no se estaciona, pero se puede parar para carga o pasajeros.');
add(2,SC,'cordon','Cordón rojo: prohibido estacionar y detenerse',curb(R),'Cordón rojo: ni estacionar ni detenerse.');

return S;
})();
const svg=s=>`<svg viewBox="0 0 200 200" role="img" aria-label="señal">${s.s}</svg>`;
const $=id=>document.getElementById(id);
const grp=s=>s.g==='excl'?'veh':s.g;
const LV=[null,{t:'Nivel 1 · Básico',d:'Las que ves todos los días'},{t:'Nivel 2 · Intermedio',d:'Ruta, restricciones y servicios'},{t:'Nivel 3 · Avanzado',d:'Las menos comunes y las más confundibles'}];
const NEED=2, ROUND=20, EXAM_N=40, EXAM_PASS=36, TH=90;
let st={m:{},exam:0,pass:false};
try{const x=JSON.parse(localStorage.getItem('senales_v2'));if(x&&x.m)st=x}catch(e){}
const save=()=>{try{localStorage.setItem('senales_v2',JSON.stringify(st))}catch(e){}};
const ofL=l=>SIGNS.filter(s=>s.l===l);
const learned=l=>ofL(l).filter(s=>(st.m[s.n]||0)>=NEED).length;
const done=l=>learned(l)===ofL(l).length;
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let mode,deck,idx,hits,streak,misses,cur,card,busy;

function show(v){
  for(const id of['home','game','end','study'])$(id).classList.toggle('on',id===v);
  $('back').style.display=v==='home'?'none':'block';
}
function home(){
  if(card){card.remove();card=null}
  let h=`<p class="lead">Aparece una señal con un significado. Deslizá a la derecha si es correcto y a la izquierda si no. Una señal queda <b>aprendida</b> cuando la acertás ${NEED} veces seguidas; con todas aprendidas se abre el nivel siguiente.</p>`;
  for(let l=1;l<=3;l++){
    const n=ofL(l).length,k=learned(l),lock=l>1&&!done(l-1);
    h+=`<button class="lvl ${lock?'lock':''} ${k===n?'done':''}" data-l="${l}" ${lock?'disabled':''}>
      <b>${LV[l].t}<em>${lock?'🔒':k+' / '+n}</em></b><small>${lock?'Completá el nivel anterior':LV[l].d}</small>
      <div class="meter"><i style="width:${k/n*100}%"></i></div></button>`;
  }
  const lockE=!done(3);
  h+=`<button class="lvl ${lockE?'lock':''} ${st.pass?'done':''}" data-l="x" ${lockE?'disabled':''}>
    <b>Examen final<em>${lockE?'🔒':st.exam?'Mejor: '+st.exam+' / '+EXAM_N:''}</em></b>
    <small>${lockE?'Completá los 3 niveles':EXAM_N+' señales mezcladas, sin ayudas. Se aprueba con '+EXAM_PASS+'.'}</small></button>
    <button class="sec" id="goStudy" style="margin-top:6px">📖 Estudiar las ${SIGNS.length} señales</button>
    <button class="reset" id="reset">Borrar mi progreso</button>`;
  $('home').innerHTML=h;
  $('home').querySelectorAll('.lvl').forEach(b=>b.onclick=()=>start(b.dataset.l==='x'?'x':+b.dataset.l));
  $('goStudy').onclick=()=>study(1);
  let armed=false;
  $('reset').onclick=e=>{if(!armed){armed=true;e.target.textContent='Tocá de nuevo para confirmar';return}
    st={m:{},exam:0,pass:false};save();home()};
  show('home');
}
function start(m){
  mode=m;idx=0;hits=0;streak=0;misses=[];
  if(m==='x')deck=shuffle(SIGNS.slice()).slice(0,EXAM_N);
  else{
    const pool=shuffle(ofL(m).slice()).sort((a,b)=>(st.m[a.n]||0)-(st.m[b.n]||0));
    deck=shuffle(pool.slice(0,ROUND));
  }
  $('s3l').textContent=m==='x'?'Pregunta':'Aprendidas';
  show('game');next();
}
function hud(){
  $('s1').textContent=hits;$('s2').textContent=streak;
  $('s3').textContent=mode==='x'?Math.min(idx+1,deck.length)+'/'+deck.length:learned(mode)+'/'+ofL(mode).length;
  $('prog').style.width=(idx/deck.length*100)+'%';
}
function wrongName(s){
  let pool=SIGNS.filter(x=>grp(x)===grp(s)&&x.n!==s.n);
  if(!pool.length||(mode!=='x'&&Math.random()<.25))pool=SIGNS.filter(x=>x.c===s.c&&x.n!==s.n);
  return pool[Math.random()*pool.length|0].n;
}
function next(){
  hud();
  if(idx>=deck.length)return finish();
  const sign=deck[idx],truth=Math.random()<.5,shown=truth?sign.n:wrongName(sign);
  cur={sign,truth,shown};
  if(card)card.remove();
  card=document.createElement('div');card.className='card';
  card.innerHTML=`<div class="stamp yes">CORRECTO</div><div class="stamp no">INCORRECTO</div>
    <div class="cat">${sign.c}</div>${svg(sign)}<div class="q">¿Esta señal significa…?</div>
    <div class="name ${shown.length>34?'long':''}">${shown}</div>`;
  $('stage').insertBefore(card,$('flash'));
  drag(card);busy=false;
}
function drag(el){
  let x0=null,dx=0;
  const set=()=>{el.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;
    el.children[0].style.opacity=Math.max(0,Math.min(1,dx/TH));
    el.children[1].style.opacity=Math.max(0,Math.min(1,-dx/TH));};
  el.onpointerdown=e=>{if(busy)return;x0=e.clientX;dx=0;el.classList.remove('anim');try{el.setPointerCapture(e.pointerId)}catch(_){}};
  el.onpointermove=e=>{if(x0===null)return;dx=e.clientX-x0;set()};
  el.onpointerup=el.onpointercancel=()=>{if(x0===null)return;x0=null;
    if(Math.abs(dx)>TH)answer(dx>0);else{el.classList.add('anim');dx=0;set()}};
}
function flash(t,c,ms){const f=$('flash');f.textContent=t;f.style.color=c;f.classList.add('on');
  setTimeout(()=>{f.classList.remove('on');next()},ms)}
function answer(yes){
  if(busy||!card||idx>=deck.length||!$('game').classList.contains('on'))return;busy=true;
  card.classList.add('anim');
  card.style.transform=`translateX(${yes?520:-520}px) rotate(${yes?28:-28}deg)`;card.style.opacity=0;
  card.children[yes?0:1].style.opacity=1;
  const ok=yes===cur.truth,s=cur.sign;idx++;
  if(ok){hits++;streak++}else{streak=0;misses.push(s)}
  if(mode==='x'){hud();return flash('Anotado','var(--mute)',350)}
  st.m[s.n]=ok?Math.min(NEED,(st.m[s.n]||0)+1):0;save();hud();
  if(ok)return flash(st.m[s.n]>=NEED?'¡Aprendida!':'¡Bien!','var(--ok)',550);
  $('shT').textContent=cur.truth?'Era correcto':'Era incorrecto';
  $('shS').innerHTML=svg(s);$('shN').textContent=s.n;$('shP').textContent=s.t;
  setTimeout(()=>$('sheet').classList.add('on'),250);
}
const row=m=>`<div class="miss">${svg(m)}<div><b>${m.n}</b><span>${m.t}</span></div></div>`;
function finish(){
  if(card){card.remove();card=null}
  const n=deck.length,uniq=[...new Set(misses)];
  let h;
  if(mode==='x'){
    const ok=hits>=EXAM_PASS;if(hits>st.exam)st.exam=hits;if(ok)st.pass=true;save();
    h=`<div class="big ${ok?'ok':'bad'}">${hits}/${n}</div><h2>${ok?'¡Examen aprobado!':'No aprobado'}</h2>
      <p>${ok?'Conocés las señales del sistema vial argentino.':'Se aprueba con '+EXAM_PASS+'. Repasá las que fallaste y volvé a intentar.'}</p>
      <button class="pri" id="again">Rendir de nuevo</button>`;
  }else{
    const k=learned(mode),t=ofL(mode).length,full=k===t;
    h=`<div class="big ${full?'ok':''}">${hits}/${n}</div><h2>${full?'¡Nivel completo!':'Aprendidas: '+k+' de '+t}</h2>
      <p>${full?(mode<3?'Se desbloqueó el nivel siguiente.':'Se desbloqueó el examen final.'):'Seguí jugando: primero salen las que todavía no aprendiste.'}</p>
      <button class="pri" id="again">${full?'Practicar otra vez':'Seguir con este nivel'}</button>`;
  }
  h+=`<button class="sec" id="toHome">Volver al inicio</button>`+(uniq.length?'<h3>Para repasar</h3>'+uniq.map(row).join(''):'');
  $('end').innerHTML=h;$('end').scrollTop=0;
  $('again').onclick=()=>start(mode);$('toHome').onclick=home;show('end');
}
function study(l){
  const cats=[...new Set(SIGNS.map(s=>s.c))];
  $('study').innerHTML=`<div class="tabs">${[1,2,3].map(i=>`<button class="${i===l?'on':''}" data-l="${i}">Nivel ${i}</button>`).join('')}</div>`+
    cats.map(c=>{const r=ofL(l).filter(s=>s.c===c);return r.length?`<h3>${c} · ${r.length}</h3>`+r.map(row).join(''):''}).join('');
  $('study').querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>study(+b.dataset.l));
  $('study').scrollTop=0;show('study');
}
$('byes').onclick=()=>answer(true);
$('bno').onclick=()=>answer(false);
$('back').onclick=()=>{$('sheet').classList.remove('on');home()};
$('shB').onclick=()=>{$('sheet').classList.remove('on');next()};
addEventListener('keydown',e=>{
  if($('sheet').classList.contains('on')){if(e.key==='Enter')$('shB').click();return}
  if(e.key==='ArrowRight')answer(true);if(e.key==='ArrowLeft')answer(false)});
home();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
