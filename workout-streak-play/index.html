<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<title>Workout Streak</title>
<meta name="theme-color" content="#17181B">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Workout Streak">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<script>window.APP_ICON_192 = "icon-192.png";</script>
<link rel="manifest" href="manifest.webmanifest">
<script>if("serviceWorker" in navigator){window.addEventListener("load",function(){navigator.serviceWorker.register("sw.js").then(function(r){r.update();}).catch(function(){});});}</script>
<meta name="description" content="Workout Streak: tus rutinas, tu progreso y tu racha semanal.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#17181B;
    --panel:#1E2024;
    --panel-2:#25272C;
    --line:#34363B;
    --line-soft:#2A2C31;
    --chalk:#ECE9E2;
    --ash:#8D9096;
    --brass:#4FC3F7;
    --brass-dim:rgba(79,195,247,0.14);
    --amber:#C9A227;
    --celeste:#4FC3F7;
    --celeste-dim:rgba(79,195,247,0.14);
    --ember:#B4432F;
    --ember-dim:rgba(180,67,47,0.14);
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;background:var(--ink);}
  body{
    font-family:'Inter',sans-serif;
    color:var(--chalk);
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:640px;margin:0 auto;min-height:100vh;padding:22px 16px 60px;}

  /* header */
  .top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;}
  .brand{display:flex;align-items:baseline;gap:10px;min-width:0;}
  .brand-mark{display:flex;align-items:center;justify-content:center;width:34px;height:34px;flex-shrink:0;}
  .brand-mark img{width:100%;height:100%;object-fit:contain;display:block;}
  h1{font-family:'Oswald','Arial Narrow',sans-serif;font-size:21px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--brass);}
  .icon-btn{background:var(--panel);border:1px solid var(--line);border-radius:7px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--ash);flex-shrink:0;transition:border-color .15s,color .15s;}
  .icon-btn:hover{border-color:var(--brass);color:var(--brass);}
  .icon-btn svg{width:17px;height:17px;}
  .header-actions{display:flex;gap:8px;flex-shrink:0;}
  .install-btn{display:none;}
  .install-btn.show{display:flex;}

  .week-row{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px;}
  .week-dots{display:flex;gap:7px;}
  .dot{width:9px;height:9px;border-radius:50%;border:1.5px solid var(--line);}
  .dot.done{background:var(--celeste);border-color:var(--celeste);}
  .dot.rest{border:none;position:relative;width:9px;height:9px;}
  .dot.rest::after{content:'';position:absolute;left:0;right:0;top:3.5px;height:1.5px;background:var(--line);}
  .week-actions{display:flex;align-items:center;gap:14px;}
  .reset-btn{background:none;border:none;color:var(--ash);font-size:12px;cursor:pointer;font-family:'Inter',sans-serif;text-decoration:underline;text-underline-offset:2px;padding:0;white-space:nowrap;}
  .reset-btn:hover{color:var(--chalk);}
  .app-footer{text-align:center;color:var(--ash);font-size:11px;opacity:.55;padding:22px 0 10px;font-family:'Inter',sans-serif;}
  .reset-btn:disabled{opacity:.5;cursor:default;text-decoration:none;}

  /* day tabs */
  .day-tabs{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:22px;}
  .day-tab{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:9px 2px 7px;text-align:center;cursor:pointer;color:var(--ash);}
  .day-tab .lbl{font-family:'Oswald','Arial Narrow',sans-serif;font-weight:600;font-size:15px;display:block;}
  .day-tab .sub{font-size:9.5px;display:block;margin-top:3px;color:var(--ash);font-weight:500;}
  .day-tab.active{border-color:var(--brass);color:var(--brass);background:var(--brass-dim);}
  .day-tab.active .sub{color:var(--brass);}
  .day-tab.is-rest .lbl{color:var(--ash);}

  /* day view */
  .day-head{margin-bottom:14px;display:flex;align-items:baseline;justify-content:space-between;gap:10px;}
  .day-head h2{font-family:'Oswald','Arial Narrow',sans-serif;font-size:19px;font-weight:600;margin:0;}
  .day-head .focus{color:var(--ash);font-size:12.5px;margin-top:2px;}
  .day-head-text{min-width:0;}
  .day-progress{font-family:'Oswald','Arial Narrow',sans-serif;color:var(--ash);font-size:13px;flex-shrink:0;}

  .rest-card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:30px 20px;text-align:center;color:var(--ash);font-size:14px;line-height:1.7;}
  .rest-card .tag{display:inline-block;font-family:'Oswald','Arial Narrow',sans-serif;font-size:11px;letter-spacing:.1em;color:var(--ember);border:1px solid var(--ember);border-radius:3px;padding:2px 8px;margin-bottom:12px;}

  .ex-list{display:flex;flex-direction:column;gap:8px;}
  .ex-card{background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:12px;display:flex;align-items:center;gap:11px;transition:border-color .15s,background .15s;}
  .ex-card.done{border-color:var(--celeste);background:var(--celeste-dim);}
  .ex-num{font-family:'Oswald','Arial Narrow',sans-serif;font-size:13px;color:var(--ash);width:14px;flex-shrink:0;text-align:right;}
  .ex-card.done .ex-num{color:var(--celeste);}
  .ex-body{flex:1;min-width:0;}
  .ex-name{font-size:14.5px;font-weight:500;line-height:1.32;}
  .ex-meta{color:var(--ash);font-size:12px;font-family:'Oswald','Arial Narrow',sans-serif;letter-spacing:.02em;margin-top:3px;}
  .ex-weight{width:54px;background:var(--panel-2);border:1px solid var(--line);border-radius:5px;color:var(--chalk);font-size:13px;text-align:center;padding:6px 2px;font-family:'Inter',sans-serif;flex-shrink:0;}
  .ex-weight::placeholder{color:var(--ash);}
  .ex-weight:focus{outline:none;border-color:var(--brass);}
  .ex-check{width:27px;height:27px;border-radius:6px;border:1.5px solid var(--line);background:var(--panel-2);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .ex-check.checked{background:var(--celeste);border-color:var(--celeste);}
  .ex-check svg{width:15px;height:15px;stroke:var(--ink);opacity:0;}
  .ex-check.checked svg{opacity:1;}
  .ex-group-label{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--celeste);opacity:.85;margin:6px 2px 2px;font-weight:600;}
  .ex-group-label:first-child{margin-top:0;}
  .ex-delta{font-size:10.5px;margin-top:2px;font-family:'Inter',sans-serif;}
  .ex-delta.up{color:var(--celeste);}
  .ex-delta.down{color:var(--ember);}
  .ex-delta.same,.ex-delta.prev{color:var(--ash);}
  .streak-badge{display:inline-flex;align-items:center;gap:3px;background:var(--brass-dim);color:var(--brass);font-family:'Oswald','Arial Narrow',sans-serif;font-size:12px;font-weight:600;padding:3px 8px;border-radius:20px;flex-shrink:0;}
  .backup-row{display:flex;flex-wrap:wrap;justify-content:center;align-items:center;gap:8px;margin-top:10px;}

  /* weekly summary */
  .summary{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px;margin-bottom:18px;}
  .sum-top{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;}
  .sum-main{flex:1;min-width:0;}
  .sum-count{font-family:'Oswald','Arial Narrow',sans-serif;font-size:26px;font-weight:600;line-height:1;}
  .sum-count small{font-family:'Inter',sans-serif;font-size:13px;font-weight:500;color:var(--ash);margin-left:6px;}
  .sum-goal{color:var(--ash);font-size:12px;margin:6px 0 10px;}
  .sum-bar{display:flex;gap:4px;padding:2px;}
  .seg{flex:1;height:6px;border-radius:3px;background:var(--line);}
  .seg.on{background:var(--celeste);}
  .seg.goal{box-shadow:0 0 0 1.5px var(--chalk);}
  .sum-side{text-align:right;flex-shrink:0;max-width:42%;}
  .sum-pct{font-family:'Oswald','Arial Narrow',sans-serif;font-size:26px;font-weight:600;line-height:1;}
  .lv-good{color:var(--celeste);}
  .lv-ok{color:var(--amber);}
  .lv-low{color:var(--ember);}
  .lv-none{color:var(--ash);}
  .sum-pct-lbl{color:var(--ash);font-size:11.5px;line-height:1.4;margin-top:6px;}
  .sum-pct-lbl b{color:var(--chalk);font-weight:600;}
  .sum-foot{display:flex;flex-wrap:wrap;justify-content:space-between;gap:3px 12px;margin-top:12px;padding-top:11px;border-top:1px solid var(--line-soft);font-size:12px;color:var(--ash);}
  .sum-foot .up{color:var(--celeste);}
  .sum-note{font-size:12.5px;line-height:1.45;margin-top:10px;color:var(--chalk);}
  .sum-actions{margin-top:8px;}
  .tag-deload{display:inline-block;font-family:'Oswald','Arial Narrow',sans-serif;font-size:11px;letter-spacing:.06em;color:var(--celeste);border:1px solid var(--celeste);border-radius:3px;padding:1px 7px;margin-left:8px;vertical-align:middle;font-weight:500;}
  .field input[type=text]#weeklyGoal{max-width:140px;}
  button:focus-visible,.link-btn:focus-visible,.icon-btn:focus-visible{outline:2px solid var(--brass);outline-offset:2px;}

  /* overlay / modal */
  .overlay{position:fixed;inset:0;background:rgba(10,10,11,.74);display:flex;align-items:flex-end;justify-content:center;z-index:50;}
  .overlay.hidden{display:none;}
  @media (min-width:640px){.overlay{align-items:center;}}
  .panel{background:var(--panel);border:1px solid var(--line);border-radius:12px 12px 0 0;width:100%;max-width:560px;max-height:88vh;overflow-y:auto;padding:22px 18px 26px;}
  @media (min-width:640px){.panel{border-radius:12px;}}
  .panel h3{font-family:'Oswald','Arial Narrow',sans-serif;font-size:18px;margin:0 0 4px;font-weight:600;}
  .panel .desc{color:var(--ash);font-size:13px;margin:0 0 18px;line-height:1.5;}

  .field{margin-bottom:14px;}
  .field label{display:block;font-size:12px;color:var(--ash);margin-bottom:6px;}
  .field input[type=password], .field input[type=text]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--chalk);font-size:15px;padding:10px 12px;font-family:'Inter',sans-serif;}
  .field input:focus{outline:none;border-color:var(--brass);}
  .err{color:var(--ember);font-size:12.5px;margin:-6px 0 14px;min-height:1em;}

  .btn{font-family:'Inter',sans-serif;font-weight:600;font-size:14px;border-radius:7px;padding:11px 16px;cursor:pointer;border:1px solid transparent;width:100%;}
  .btn-primary{background:var(--brass);color:var(--ink);}
  .btn-primary:hover{filter:brightness(1.08);}
  .btn-danger{background:var(--ember);color:#fff;}
  .btn-danger:hover{filter:brightness(1.08);}
  .btn-ghost{background:transparent;border:1px solid var(--line);color:var(--chalk);}
  .btn-ghost:hover{border-color:var(--ash);}
  .btn-row{display:flex;gap:10px;margin-top:6px;}
  .btn-row .btn{width:auto;flex:1;}
  .link-btn{background:none;border:none;color:var(--ash);font-size:12.5px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-family:'Inter',sans-serif;}
  .link-btn:hover{color:var(--chalk);}

  .editor-tabs{display:flex;gap:6px;overflow-x:auto;margin-bottom:16px;padding-bottom:2px;}
  .editor-tab{flex-shrink:0;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;padding:7px 11px;font-size:12.5px;font-weight:600;color:var(--ash);cursor:pointer;font-family:'Oswald','Arial Narrow',sans-serif;letter-spacing:.02em;}
  .editor-tab.active{border-color:var(--brass);color:var(--brass);}

  .edit-meta-row{display:flex;gap:10px;margin-bottom:16px;}
  .edit-meta-row .field{flex:1;margin-bottom:0;}

  .daytype-toggle{display:flex;gap:6px;}
  .daytype-opt{flex:1;text-align:center;padding:9px 4px;border:1px solid var(--line);border-radius:6px;background:var(--panel-2);color:var(--ash);font-size:13px;font-weight:600;cursor:pointer;}
  .daytype-opt.active{border-color:var(--brass);color:var(--brass);background:var(--brass-dim);}

  .edit-ex{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:7px;padding:10px;margin-bottom:9px;}
  .edit-ex-row1{display:flex;gap:8px;margin-bottom:8px;}
  .edit-ex-row1 input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--chalk);font-size:13.5px;padding:8px 9px;font-family:'Inter',sans-serif;}
  .edit-ex-row1 input:focus{outline:none;border-color:var(--brass);}
  .edit-ex-row2{display:flex;align-items:center;gap:6px;}
  .edit-ex-row2 input{width:54px;background:var(--panel);border:1px solid var(--line);border-radius:5px;color:var(--chalk);font-size:13px;padding:7px 6px;text-align:center;font-family:'Inter',sans-serif;}
  .edit-ex-row2 input:focus{outline:none;border-color:var(--brass);}
  .edit-ex-row2 .x-lbl{color:var(--ash);font-size:12px;flex-shrink:0;}
  .edit-ex-row2 .spacer{flex:1;}
  .mini-btn{width:30px;height:30px;border-radius:5px;background:var(--panel);border:1px solid var(--line);color:var(--ash);display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0;}
  .mini-btn:hover{border-color:var(--ash);color:var(--chalk);}
  .mini-btn.danger:hover{border-color:var(--ember);color:var(--ember);}
  .mini-btn svg{width:14px;height:14px;}

  .add-ex-btn{width:100%;background:transparent;border:1.5px dashed var(--line);border-radius:7px;color:var(--ash);padding:10px;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;font-weight:600;margin-bottom:6px;}
  .add-ex-btn:hover{border-color:var(--brass);color:var(--brass);}

  textarea.rest-note{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--chalk);font-size:14px;padding:10px 12px;font-family:'Inter',sans-serif;min-height:80px;resize:vertical;}
  textarea.rest-note:focus{outline:none;border-color:var(--brass);}

  .editor-footer{display:flex;gap:10px;margin-top:20px;padding-top:16px;border-top:1px solid var(--line-soft);}
  .editor-footer .btn{flex:1;}
  .editor-bottom-link{text-align:center;margin-top:14px;}

  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(16px);background:var(--panel);border:1px solid var(--brass);color:var(--chalk);padding:11px 18px;border-radius:7px;font-size:13px;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s;z-index:70;font-weight:500;}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* ---- versión pública ---- */
  .btn:disabled{opacity:.4;cursor:default;filter:none;}
  .btn-lg{padding:14px 18px;font-size:15.5px;border-radius:10px;}
  .btn-inline{width:auto;margin-top:14px;}
  .pro-tag{display:inline-block;font-family:'Inter',sans-serif;font-size:9.5px;font-weight:700;letter-spacing:.06em;color:var(--brass);border:1px solid var(--brass);border-radius:4px;padding:1px 5px;line-height:1.4;vertical-align:middle;text-decoration:none;}
  .pro-tag.solid{background:var(--brass);color:var(--ink);}
  .brand{align-items:center;}
  .brand .pro-tag{flex-shrink:0;}
  .routine-chip{display:inline-flex;align-items:center;gap:7px;background:var(--panel);border:1px solid var(--line);color:var(--chalk);border-radius:20px;padding:6px 12px 6px 10px;font-size:12.5px;font-weight:600;font-family:'Inter',sans-serif;cursor:pointer;margin:-4px 0 14px;max-width:100%;}
  .routine-chip svg{width:14px;height:14px;color:var(--brass);flex-shrink:0;}
  .routine-chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  @media (max-width:420px){ .header-actions{gap:6px;} .icon-btn{width:36px;height:36px;} h1{font-size:19px;} }

  /* primer uso */
  .ob-wrap{min-height:calc(100vh - 82px);display:flex;align-items:center;}
  .ob{width:100%;}
  .ob-welcome{text-align:center;padding-top:10px;}
  .ob-logo{width:112px;height:112px;display:block;margin:0 auto 18px;filter:drop-shadow(0 10px 30px var(--brass-dim));}
  .ob-title{font-family:'Oswald','Arial Narrow',sans-serif;font-size:38px;font-weight:700;color:var(--brass);margin:0;letter-spacing:.01em;}
  .ob-tag{color:var(--ash);font-size:15px;margin:6px 0 28px;}
  .ob-points{list-style:none;padding:0;margin:0 auto 30px;text-align:left;max-width:340px;display:flex;flex-direction:column;gap:14px;}
  .ob-points li,.pay-feats li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.4;color:var(--ash);}
  .ob-points b,.pay-feats b{color:var(--chalk);font-weight:600;}
  .ob-dot{width:24px;height:24px;border-radius:7px;background:var(--brass);display:flex;align-items:center;justify-content:center;flex-shrink:0;margin-top:1px;}
  .ob-dot svg{width:14px;height:14px;stroke:var(--ink);}
  .ob-import{display:inline-block;margin-top:18px;}
  .ob-step{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:6px;}
  .ob-h{font-family:'Oswald','Arial Narrow',sans-serif;font-size:26px;font-weight:600;margin:0 0 6px;}
  .ob .desc{color:var(--ash);font-size:13.5px;line-height:1.5;margin:0 0 18px;}
  .ob-back{display:block;margin:16px auto 0;}
  .tpl-list{display:flex;flex-direction:column;gap:10px;margin-bottom:6px;}
  .tpl-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;text-align:left;cursor:pointer;color:var(--chalk);font-family:'Inter',sans-serif;transition:border-color .15s,background .15s;width:100%;}
  .tpl-card:hover,.tpl-card:focus-visible{border-color:var(--brass);background:var(--brass-dim);outline:none;}
  .tpl-top{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .tpl-name{font-family:'Oswald','Arial Narrow',sans-serif;font-size:17px;font-weight:600;}
  .tpl-tag{font-size:11px;font-weight:600;color:var(--brass);background:var(--brass-dim);border-radius:20px;padding:3px 9px;white-space:nowrap;}
  .tpl-desc{font-size:13px;color:var(--ash);margin-top:4px;line-height:1.4;}
  .tpl-prev{font-size:11.5px;color:var(--chalk);opacity:.7;margin-top:8px;}
  .ob-days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-bottom:12px;}
  .ob-day{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:12px 0;color:var(--ash);font-weight:600;font-size:13px;cursor:pointer;font-family:'Inter',sans-serif;}
  .ob-day.on{background:var(--brass);border-color:var(--brass);color:var(--ink);}
  .ob-hint{font-size:12.5px;color:var(--ash);margin-bottom:14px;}
  .ob-hint.ok{color:var(--brass);}
  .ob-plan{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 14px;margin-bottom:18px;}
  .ob-plan div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line-soft);font-size:13.5px;}
  .ob-plan div:last-child{border-bottom:none;}
  .ob-plan span{color:var(--ash);}

  /* menú */
  .menu-group{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:10px;margin-bottom:12px;overflow:hidden;}
  .menu-item{display:flex;align-items:center;gap:12px;width:100%;background:none;border:none;border-bottom:1px solid var(--line-soft);padding:13px 14px;color:var(--chalk);font-family:'Inter',sans-serif;font-size:14px;text-align:left;cursor:pointer;}
  .menu-item:last-child{border-bottom:none;}
  .menu-item:hover{background:rgba(255,255,255,.03);}
  .mi-ic{color:var(--brass);display:flex;}
  .mi-ic svg{width:19px;height:19px;}
  .mi-txt{flex:1;min-width:0;}
  .mi-txt small{display:block;color:var(--ash);font-size:11.5px;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .mi-chev{color:var(--ash);display:flex;}
  .mi-chev svg{width:16px;height:16px;}
  .menu-group.demo{border-style:dashed;border-color:var(--line);}
  .demo-lbl{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ash);padding:10px 14px 0;}

  .pro-card small{color:var(--ash);font-size:12px;}

  .pc-star svg{width:19px;height:19px;}

  .pay-head{display:flex;gap:14px;align-items:center;margin-bottom:18px;}
  .pay-head img{width:58px;height:58px;flex-shrink:0;}
  .pay-kicker{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--brass);font-weight:700;margin-bottom:3px;}
  .pay-head h3{font-size:20px;line-height:1.25;margin:0;}
  .pay-feats{list-style:none;padding:0;margin:0 0 18px;display:flex;flex-direction:column;gap:12px;}
  .plans{display:flex;flex-direction:column;gap:8px;margin-bottom:14px;}
  .plan{display:flex;align-items:center;gap:12px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;cursor:pointer;color:var(--chalk);font-family:'Inter',sans-serif;text-align:left;width:100%;}

  .plan-radio{width:18px;height:18px;border-radius:50%;border:2px solid var(--line);flex-shrink:0;}
  .plan.on .plan-radio{border-color:var(--brass);box-shadow:inset 0 0 0 3px var(--panel-2);background:var(--brass);}
  .plan-main{flex:1;font-size:14.5px;}
  .plan-main em{display:block;font-style:normal;font-size:11px;color:var(--brass);font-weight:600;margin-top:2px;}
  .plan-price{text-align:right;}
  .plan-price b{display:block;font-size:14.5px;}
  .plan-price small{color:var(--ash);font-size:11px;}
  .pay-fine{color:var(--ash);font-size:11px;line-height:1.5;margin:12px 0 8px;text-align:center;}
  .pay-links{display:flex;justify-content:center;gap:22px;}

  /* rutinas */
  .rt-list{display:flex;flex-direction:column;gap:8px;margin-bottom:12px;}
  .rt-row{display:flex;align-items:center;gap:8px;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:8px 8px 8px 10px;}
  .rt-row.on{border-color:var(--brass);}
  .rt-name{flex:1;min-width:0;background:transparent;border:1px solid transparent;border-radius:5px;color:var(--chalk);font-size:14px;font-weight:600;padding:6px;font-family:'Inter',sans-serif;}
  .rt-name:focus{outline:none;border-color:var(--line);background:var(--panel);}
  .rt-meta{font-size:11.5px;color:var(--ash);white-space:nowrap;}
  .rt-active{font-size:11px;font-weight:700;color:var(--brass);padding:0 6px;white-space:nowrap;}
  .mini-btn.wide{width:auto;padding:0 10px;font-size:12px;font-weight:600;font-family:'Inter',sans-serif;}

  /* colores */
  .swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px;margin-bottom:16px;}
  .swatch{display:flex;flex-direction:column;align-items:center;gap:8px;background:var(--panel-2);border:1.5px solid var(--line);border-radius:10px;padding:14px 6px 10px;color:var(--chalk);font-size:12.5px;font-family:'Inter',sans-serif;cursor:pointer;}
  .swatch span{width:30px;height:30px;border-radius:50%;}
  .swatch.on{border-color:var(--chalk);}

  .sel{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:6px;color:var(--chalk);font-size:15px;padding:10px 12px;font-family:'Inter',sans-serif;}

  .stats b.up{color:var(--brass);}
  .ch-readout{font-size:12.5px;color:var(--ash);margin:4px 0 2px;min-height:18px;}
  .ch-readout b{color:var(--chalk);}
  .chart{width:100%;height:auto;display:block;touch-action:manipulation;}
  .ch-grid{stroke:var(--line-soft);stroke-width:1;}
  .ch-ax{fill:var(--ash);font-size:11px;font-family:'Inter',sans-serif;}
  .ch-line{fill:none;stroke:var(--brass);stroke-width:2.5;stroke-linejoin:round;stroke-linecap:round;}
  .ch-dot{fill:var(--brass);stroke:var(--panel);stroke-width:2;pointer-events:none;}
  .ch-hit{fill:transparent;cursor:pointer;}
  .ch-pt.sel .ch-dot{stroke:var(--chalk);}
  .ch-val{fill:var(--chalk);font-size:12px;font-weight:600;font-family:'Inter',sans-serif;}

  .empty-state{text-align:center;color:var(--ash);padding:24px 10px;font-size:13.5px;line-height:1.55;}

  .field input[type=text]#weeklyGoal{max-width:none;}
  .editor-tab.rest{opacity:.55;}

  .pk-item:hover{color:var(--brass);}
  .pk-item small{color:var(--ash);font-size:11.5px;white-space:nowrap;}
  .pk-item.has{opacity:.5;}

  /* importar desde texto */
  .imp-open{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--brass-dim);border:1px solid var(--brass);border-radius:7px;color:var(--brass);padding:10px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;margin-bottom:16px;}
  .imp-open:hover{filter:brightness(1.1);}
  textarea.imp-text{width:100%;min-height:190px;background:var(--panel-2);border:1px solid var(--line);border-radius:7px;color:var(--chalk);font-size:14px;line-height:1.5;padding:10px 12px;font-family:'Inter',sans-serif;resize:vertical;}
  textarea.imp-text:focus{outline:none;border-color:var(--brass);}
  .imp-help{font-size:12px;color:var(--ash);line-height:1.5;margin:8px 0 14px;}
  .imp-help code{font-family:'Inter',sans-serif;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:4px;padding:0 4px;color:var(--chalk);}
  .imp-sample{background:none;border:none;color:var(--brass);font-size:12px;text-decoration:underline;text-underline-offset:2px;cursor:pointer;padding:0;font-family:'Inter',sans-serif;}
  .imp-prev{background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:4px 12px;margin-bottom:12px;}
  .imp-day{padding:10px 0;border-bottom:1px solid var(--line-soft);}
  .imp-day:last-child{border-bottom:none;}
  .imp-day-h{display:flex;justify-content:space-between;align-items:baseline;gap:10px;}
  .imp-day-h b{font-family:'Oswald','Arial Narrow',sans-serif;font-size:15px;font-weight:600;}
  .imp-day-h span{font-size:11.5px;color:var(--ash);white-space:nowrap;}
  .imp-day-f{font-size:12px;color:var(--ash);margin-top:1px;}
  .imp-ex{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:4px 0 0;}
  .imp-ex span:first-child{min-width:0;}
  .imp-ex small{font-family:'Oswald','Arial Narrow',sans-serif;color:var(--brass);font-size:12.5px;white-space:nowrap;}
  .imp-ex.warn small{color:var(--amber);}
  .imp-note{font-size:11.5px;color:var(--amber);margin:2px 0 10px;line-height:1.45;}
  .imp-empty{font-size:12.5px;color:var(--ash);padding:12px 0;text-align:center;}

  var Play = {
    svc: null, details: {}, ready: null,
    init: function(){
      if(this.ready) return this.ready;
      var self = this;
      this.ready = (async function(){
        if(!("getDigitalGoodsService" in window)) return false;
        try{ self.svc = await window.getDigitalGoodsService(PLAY_METHOD); }catch(e){ self.svc = null; }
        if(!self.svc) return false;
        try{
          var items = await self.svc.getDetails(proIdList());
          (items || []).forEach(function(it){ self.details[it.itemId] = it; });
        }catch(e){ console.error("getDetails", e); }

    verify: async function(itemId, token){
      var r = await fetch(BILLING_API.replace(/\/$/, "") + "/verify", {
        method:"POST", headers:{"Content-Type":"application/json"},
        body: JSON.stringify({itemId:itemId, purchaseToken:token, subscription: SUB_IDS.indexOf(itemId) >= 0})
      });
      if(!r.ok) throw new Error("verify " + r.status);
      return await r.json();
    },
    check: async function(){
      var list = await this.svc.listPurchases();
      var ids = proIdList(), lastErr = null;
      for(var i = 0; i < (list || []).length; i++){
        var p = list[i];
        if(ids.indexOf(p.itemId) < 0) continue;
        try{
          var res = await this.verify(p.itemId, p.purchaseToken);
          if(res && res.active) return {active:true, itemId:p.itemId};
        }catch(e){ lastErr = e; }
      }
      if(lastErr) throw lastErr;
      return {active:false};
    },
    buy: async function(itemId){
      var req = new PaymentRequest([{supportedMethods:PLAY_METHOD, data:{sku:itemId}}],
        {total:{label:"Total", amount:{currency:"USD", value:"0"}}});
      var resp = await req.show();
      var token = resp.details && resp.details.purchaseToken;
      try{
        var res = await this.verify(itemId, token);
        await resp.complete(res && res.active ? "success" : "fail");
        return res;
      }catch(e){
        await resp.complete("fail");
        throw e;
      }
    },

      var d = this.details[itemId];
      if(!d || !d.price) return null;
      var langs = [navigator.language, "es-AR"];

  function getWeekKey(d){
    d = d || new Date();
    var date = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
    var dayNum = (date.getUTCDay() + 6) % 7;
    date.setUTCDate(date.getUTCDate() - dayNum + 3);
    var firstThursday = new Date(Date.UTC(date.getUTCFullYear(), 0, 4));
    var fdDayNum = (firstThursday.getUTCDay() + 6) % 7;
    firstThursday.setUTCDate(firstThursday.getUTCDate() - fdDayNum + 3);
    var weekNum = 1 + Math.round((date - firstThursday) / (7 * 86400000));
    return date.getUTCFullYear() + "-W" + String(weekNum).padStart(2, "0");
  }

  function weekMonday(key){
    var m = /(\d+)-W(\d+)/.exec(key);
    if(!m) return null;
    var jan4 = new Date(Date.UTC(+m[1], 0, 4));
    var dow = (jan4.getUTCDay() + 6) % 7;
    var mon = new Date(jan4);
    mon.setUTCDate(jan4.getUTCDate() - dow + (+m[2] - 1) * 7);
    return mon;
  }

  function weekStatus(weekKey){
    var wc = state.checks[weekKey] || {};

    var days = plannedDays(routine);
    var done = days.filter(function(k){
      var dc = wc[k] || {};

    }).length;
    var goal = effectiveGoal(days.length);
    var deload = !!state.config.deloads[weekKey];
    return {planned:days.length, done:done, goal:goal, deload:deload, met: deload || (days.length > 0 && done >= goal)};
  }

  function earliestWeekKey(){
    var keys = Object.keys(state.checks).filter(function(k){
      var wc = state.checks[k] || {};
      return Object.keys(wc).some(function(day){
        var dc = wc[day] || {};
        return Object.keys(dc).some(function(id){ return dc[id] && (dc[id].done || dc[id].peso); });
      });
    });
    Object.keys(state.config.deloads).forEach(function(k){ if(state.config.deloads[k]) keys.push(k); });
    if(!keys.length) return null;
    keys.sort();
    return keys[0];
  }

  function computeStreakInfo(){
    var info = {streak:0, atRisk:false, sinceDeload:0};
    var earliest = earliestWeekKey();
    if(!earliest) return info;
    var cur = weekStatus(getWeekKey());
    var misses = 0, counting = true;
    for(var i = cur.met ? 0 : 1; i < 520; i++){
      var key = getWeekKey(dateAtOffset(i));
      if(key < earliest) break;
      var s = weekStatus(key);
      if(s.met){
        info.streak++; misses = 0;
        if(counting){ if(s.deload) counting = false; else info.sinceDeload++; }
      } else {
        misses++; counting = false;
        if(i === 1 && !cur.met) info.atRisk = true;
        if(misses >= 2) break;
      }
    }
    return info;
  }

  function recentAdherence(){
    var earliest = earliestWeekKey();
    if(!earliest) return null;
    var planned = 0, done = 0, n = 0;
    for(var i = 1; i <= ADHERENCE_WEEKS; i++){
      var key = getWeekKey(dateAtOffset(i));
      if(key < earliest) break;
      var s = weekStatus(key);
      if(s.deload) continue;
      planned += s.planned; done += s.done; n++;
    }
    if(!planned) return null;
    var pct = Math.round(done / planned * 100);
    var level = pct >= 80 ? "good" : (pct >= 60 ? "ok" : "low");
    return {pct:pct, level:level, label: level === "good" ? "Muy bueno" : (level === "ok" ? "Aceptable" : "Ajustar rutina"), weeks:n};
  }

  function rgbToHsv(r, g, b){
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), d = mx - mn, h = 0;
    if(d){
      if(mx === r) h = ((g - b) / d) % 6; else if(mx === g) h = (b - r) / d + 2; else h = (r - g) / d + 4;
      h *= 60; if(h < 0) h += 360;

  function themedIcon(id, hex){
    if(iconCache[id]) return Promise.resolve(iconCache[id]);
    return new Promise(function(resolve){
      var img = new Image();
      img.onload = function(){
        try{
          var c = document.createElement("canvas"); c.width = img.width; c.height = img.height;
          var ctx = c.getContext("2d"); ctx.drawImage(img, 0, 0);
          var data = ctx.getImageData(0, 0, c.width, c.height), px = data.data;
          var light = hexToRgb(hex), dark = light.map(function(v){ return Math.round(v * 0.78); });
          for(var i = 0; i < px.length; i += 4){
            if(!px[i + 3]) continue;
            var hsv = rgbToHsv(px[i], px[i + 1], px[i + 2]);
            if(hsv[0] < 180 || hsv[0] > 222 || hsv[1] < 0.35 || hsv[2] < 0.45) continue;
            var t = Math.max(0, Math.min(1, (hsv[2] - 0.81) / 0.16));
            px[i] = Math.round(dark[0] + (light[0] - dark[0]) * t);
            px[i + 1] = Math.round(dark[1] + (light[1] - dark[1]) * t);
            px[i + 2] = Math.round(dark[2] + (light[2] - dark[2]) * t);
          }
          ctx.putImageData(data, 0, 0);
          iconCache[id] = c.toDataURL("image/png");
        }catch(e){ iconCache[id] = APP_ICON_192; }
        resolve(iconCache[id]);
      };
      img.onerror = function(){ resolve(APP_ICON_192); };
      img.src = APP_ICON_192;
    });
  }

    var rgb = hexToRgb(t.hex), dim = "rgba(" + rgb.join(",") + ",0.14)";
    var css = ":root{--brass:" + t.hex + " !important;--celeste:" + t.hex + " !important;--brass-dim:" + dim + " !important;--celeste-dim:" + dim + " !important;}";
    var el = document.getElementById("wsTheme");
    if(!el){ el = document.createElement("style"); el.id = "wsTheme"; document.body.appendChild(el); }
    if(el.textContent !== css) el.textContent = css;
    var s = document.documentElement.style;
    s.setProperty("--brass", t.hex); s.setProperty("--celeste", t.hex);
    s.setProperty("--brass-dim", dim); s.setProperty("--celeste-dim", dim);
    themedIcon(t.id, t.hex).then(function(src){
      iconSrc = src;
      var imgs = document.querySelectorAll("img.app-icon");
      for(var i = 0; i < imgs.length; i++){ if(imgs[i].src !== src) imgs[i].src = src; }
    });
    iconSrc = iconCache[t.id] || iconSrc;
  }

  function summaryHtml(info){
    var s = weekStatus(getWeekKey());
    if(s.planned === 0) return "";
    var adh = recentAdherence(), pts = weekPoints(getWeekKey()), total = totalPoints(), prog = weekProgressCount();
    var segs = "";
    for(var i = 0; i < s.planned; i++) segs += '<i class="seg' + (i < s.done ? " on" : "") + (i === s.goal - 1 ? " goal" : "") + '"></i>';
    var note;
    if(s.deload) note = "Semana de descarga: cuenta como cumplida y no corta la racha.";
    else if(info.atRisk) note = "La semana pasada no se cumplió. Si esta tampoco, la racha se corta.";
    else if(info.sinceDeload >= DELOAD_HINT_AFTER) note = "Llevás " + info.sinceDeload + " semanas seguidas sin descarga. Una semana más liviana ayuda a recuperar.";
    else if(s.met) note = "Meta de la semana cumplida: sumaste " + BONUS_WEEK + " puntos de bonus.";
    else { var left = s.goal - s.done; note = left === 1 ? "Te falta 1 sesión para cumplir la meta." : "Te faltan " + left + " sesiones para cumplir la meta."; }
    var side = adh
      ? '<div class="sum-pct lv-' + adh.level + '">' + adh.pct + '%</div><div class="sum-pct-lbl"><b>' + adh.label + '</b><br>adherencia, últimas ' + adh.weeks + (adh.weeks === 1 ? ' semana' : ' semanas') + '</div>'
      : '<div class="sum-pct lv-none">—</div><div class="sum-pct-lbl">Adherencia<br>desde la semana que viene</div>';
    return '<section class="summary"><div class="sum-top"><div class="sum-main">' +
        '<div class="sum-count">' + s.done + '<small>de ' + s.planned + ' sesiones' + (s.deload ? '<span class="tag-deload">Descarga</span>' : '') + '</small></div>' +
        '<div class="sum-goal">Meta: ' + s.goal + ' de ' + s.planned + ' por semana</div>' +
        '<div class="sum-bar" title="Sesiones completas esta semana. El contorno blanco marca la meta.">' + segs + '</div>' +
      '</div><div class="sum-side">' + side + '</div></div>' +
      '<div class="sum-foot"><span>' + pts + ' pts esta semana · ' + total + ' en total</span>' +
        (prog > 0 ? '<span class="up">↑ ' + prog + (prog === 1 ? ' ejercicio' : ' ejercicios') + ' con más peso</span>' : '<span>Sin subas de peso todavía</span>') + '</div>' +
      '<div class="sum-note">' + note + '</div>' +
      '<div class="sum-actions"><button class="link-btn" onclick="WS.toggleDeload()">' + (s.deload ? 'Quitar descarga' : 'Marcar semana de descarga') + '</button></div>' +
    '</section>';
  }

  function renderDayView(){
    var view = document.getElementById("dayView");
    var d = state.config.routine[state.selectedDay];
    if(d.rest){
      view.innerHTML = '<div class="day-head"><div class="day-head-text"><h2>' + DAY_NAME[state.selectedDay] + '</h2></div></div>' +
        '<div class="rest-card"><span class="tag">Descanso</span><br>' + esc(d.note || "Descanso.") + '</div>';
      return;
    }
    var dc = dayChecks(state.selectedDay);
    var total = d.exercises.length;
    var done = d.exercises.filter(function(ex){ return dc[ex.id] && dc[ex.id].done; }).length;
    if(total === 0){
      view.innerHTML = '<div class="day-head"><div class="day-head-text"><h2>' + esc(d.title) + '</h2>' +
        (d.focus ? '<div class="focus">' + esc(d.focus) + '</div>' : '') + '</div></div>' +
        '<div class="rest-card">Todavía no hay ejercicios en este día.<br><button class="btn btn-primary btn-inline" onclick="WS.openEdit()">Agregar ejercicios</button></div>';
      return;
    }
    var ordered = d.exercises.map(function(ex, i){ return {ex:ex, i:i, st:(dc[ex.id] || {done:false, peso:""})}; });
    var doneItems = ordered.filter(function(o){ return o.st.done; }).sort(function(a, b){
      var ta = a.st.doneAt || 0, tb = b.st.doneAt || 0;
      return ta !== tb ? ta - tb : a.i - b.i;
    });
    var pendItems = ordered.filter(function(o){ return !o.st.done; });
    function cardHtml(o){
      var ex = o.ex, st = o.st;
      var cur = parseKg(st.peso), prev = getPrevWeight(state.selectedDay, ex.id), delta = "";
      if(prev != null && st.peso && cur != null){
        var diff = cur - prev;
        if(Math.abs(diff) < 0.005) delta = '<div class="ex-delta same">= vs. sem. pasada</div>';
        else if(diff > 0) delta = '<div class="ex-delta up">↑ +' + fmtNum(diff) + ' kg vs. sem. pasada</div>';
        else delta = '<div class="ex-delta down">↓ ' + fmtNum(diff) + ' kg vs. sem. pasada</div>';
      } else if(prev != null && !st.peso){
        delta = '<div class="ex-delta prev">sem. pasada: ' + fmtNum(prev) + ' kg</div>';
      }
      return '<div class="ex-card ' + (st.done ? "done" : "") + '">' +
        '<span class="ex-num">' + (o.i + 1) + '</span>' +
        '<div class="ex-body"><div class="ex-name">' + esc(ex.name) + '</div><div class="ex-meta">' + esc(ex.series) + ' × ' + esc(ex.reps) + '</div>' + delta + '</div>' +
        '<input class="ex-weight" type="text" inputmode="decimal" placeholder="kg" value="' + esc(st.peso || "") + '" onchange="WS.setWeight(\'' + ex.id + '\', this.value)">' +
        '<div class="ex-check ' + (st.done ? "checked" : "") + '" role="checkbox" aria-checked="' + !!st.done + '" onclick="WS.toggleCheck(\'' + ex.id + '\')">' + ICON.check + '</div>' +
      '</div>';
    }
    var items = "";
    if(doneItems.length) items += '<div class="ex-group-label">Hechos · en orden</div>' + doneItems.map(cardHtml).join("");
    if(pendItems.length){
      if(doneItems.length) items += '<div class="ex-group-label">Pendientes</div>';
      items += pendItems.map(cardHtml).join("");
    }
    view.innerHTML = '<div class="day-head"><div class="day-head-text"><h2>' + esc(d.title) + '</h2><div class="focus">' + esc(d.focus || "") + '</div></div>' +
      '<div class="day-progress">' + done + '/' + total + '</div></div><div class="ex-list">' + items + '</div>';
  }

  var WS = {};

  WS.obNext = function(){ state.ob.step = 1; refreshOb(); };

    if(state.ob.step >= 2){ state.ob.step = 1; refreshOb(); return; }
    if(state.ob.mode === "onboard"){ state.ob.step = 0; refreshOb(); } else WS.openRoutines();
  };
  WS.obPick = function(id){
    var t = TEMPLATES.filter(function(x){ return x.id === id; })[0];
    state.ob.tpl = id; state.ob.days = t.defaultDays.slice(); state.ob.step = 2;
    refreshOb();
  };
  WS.obToggleDay = function(k){
    var d = state.ob.days, i = d.indexOf(k);
    if(i >= 0) d.splice(i, 1);
    else {
      var t = TEMPLATES.filter(function(x){ return x.id === state.ob.tpl; })[0];
      if(t.sessions.length && d.length >= t.sessions.length) d.shift();
      d.push(k);
    }
    refreshOb();
  };
  WS.obFinish = async function(){
    var ob = state.ob;
    var t = TEMPLATES.filter(function(x){ return x.id === ob.tpl; })[0];
    var entry = {id:"r" + Date.now().toString(36), name: t.id === "blank" ? "Mi rutina" : t.name, routine: buildRoutine(t, ob.days)};
    var c = state.config;
    if(ob.mode === "onboard") c.routines = [entry]; else c.routines.push(entry);
    c.activeId = entry.id; c.routine = entry.routine; c.onboarded = true;
    if(!c.weekRoutine) c.weekRoutine = {};
    c.weekRoutine[getWeekKey()] = entry.id;
    await saveConfig();
    var first = DAY_ORDER.filter(function(k){ return ob.days.indexOf(k) >= 0; });
    state.selectedDay = entry.routine[todayKey()].rest ? first[0] : todayKey();
    state.ob = {step:0, tpl:null, days:[], mode:"onboard"};
    closeOverlay();
    render();
    if(t.id === "blank"){ openEditorDirect(); toast("Cargá los ejercicios de cada día"); }
    else toast("¡Listo! Tu rutina está cargada");
  };

  function exName(exId){

  WS.toggleCheck = function(exId){

    if(!dc[exId]) dc[exId] = {done:false, peso:""};
    dc[exId].done = !dc[exId].done;

  function exerciseHistory(){
    var names = {};
    state.config.routines.forEach(function(r){
      DAY_ORDER.forEach(function(k){ (r.routine[k].exercises || []).forEach(function(ex){ names[ex.id] = ex.name; }); });
    });
    var map = {};
    Object.keys(state.checks).forEach(function(wk){
      var wc = state.checks[wk] || {};
      Object.keys(wc).forEach(function(day){
        var dc = wc[day] || {};
        Object.keys(dc).forEach(function(id){
          var st = dc[id], v = st && parseKg(st.peso);
          if(!v || v <= 0) return;
          var nm = (st.n || names[id] || "").trim();
          if(!nm) return;
          if(!map[nm]) map[nm] = {};
          if(!(wk in map[nm]) || v > map[nm][wk]) map[nm][wk] = v;
        });
      });
    });
    return map;
  }
  function niceStep(range){
    var raw = range / 4, mag = Math.pow(10, Math.floor(Math.log10(raw || 1)));
    var cands = [1, 2, 2.5, 5, 10];
    for(var i = 0; i < cands.length; i++){ if(cands[i] * mag >= raw) return cands[i] * mag; }
    return 10 * mag;
  }
  function chartSvg(pts){
    var W = 520, H = 230, L = 44, R = 16, T = 22, B = 30;
    var vals = pts.map(function(p){ return p.v; });
    var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
    if(hi - lo < 2){ lo -= 2; hi += 2; }
    var step = niceStep(hi - lo);
    lo = Math.floor(lo / step) * step; hi = Math.ceil(hi / step) * step;
    function x(i){ return pts.length === 1 ? (L + (W - L - R) / 2) : L + i * (W - L - R) / (pts.length - 1); }
    function y(v){ return T + (hi - v) / (hi - lo) * (H - T - B); }
    var g = "";
    for(var t = lo; t <= hi + 1e-9; t += step){
      g += '<line x1="' + L + '" x2="' + (W - R) + '" y1="' + y(t) + '" y2="' + y(t) + '" class="ch-grid"/>' +
           '<text x="' + (L - 8) + '" y="' + (y(t) + 4) + '" class="ch-ax" text-anchor="end">' + fmtNum(t) + '</text>';
    }
    var path = pts.map(function(p, i){ return (i ? "L" : "M") + x(i).toFixed(1) + " " + y(p.v).toFixed(1); }).join(" ");
    var labelIdx = [0, pts.length - 1];
    if(pts.length > 4) labelIdx.push(Math.floor((pts.length - 1) / 2));
    var xl = labelIdx.filter(function(v, i, a){ return a.indexOf(v) === i; }).map(function(i){
      return '<text x="' + x(i) + '" y="' + (H - 8) + '" class="ch-ax" text-anchor="' + (pts.length === 1 ? "middle" : (i === 0 ? "start" : (i === pts.length - 1 ? "end" : "middle"))) + '">' + fmtDM(weekMonday(pts[i].wk)) + '</text>';
    }).join("");
    var sel = state.chart.sel >= 0 && state.chart.sel < pts.length ? state.chart.sel : pts.length - 1;
    var dots = pts.map(function(p, i){
      return '<g class="ch-pt' + (i === sel ? " sel" : "") + '" onclick="WS.chartPick(' + i + ')" onmouseenter="WS.chartPick(' + i + ')">' +
        '<circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="16" class="ch-hit"/><circle cx="' + x(i) + '" cy="' + y(p.v) + '" r="' + (i === sel ? 6 : 4.5) + '" class="ch-dot"/></g>';
    }).join("");
    var sp = pts[sel];
    var lbl = '<text x="' + Math.min(Math.max(x(sel), L + 24), W - R - 24) + '" y="' + (y(sp.v) - 14) + '" class="ch-val" text-anchor="middle">' + fmtNum(sp.v) + ' kg</text>';
    return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" aria-label="Peso por semana">' + g +
      (pts.length > 1 ? '<path d="' + path + '" class="ch-line"/>' : '') + dots + lbl + xl + '</svg>';
  }
  function progressHtml(){
    var hist = exerciseHistory();
    var names = Object.keys(hist).sort(function(a, b){
      var la = Object.keys(hist[a]).sort().pop(), lb = Object.keys(hist[b]).sort().pop();
      return la === lb ? a.localeCompare(b) : (la < lb ? 1 : -1);
    });
    if(!names.length){
      return '<h3>Progreso por ejercicio</h3><div class="empty-state">' + ICON.chart +
        '<p>Todavía no hay pesos cargados.<br>Anotá el peso en tus ejercicios y acá vas a ver cómo progresás semana a semana.</p></div>' +
        '<div class="btn-row"><button class="btn btn-ghost" onclick="WS.closeConfirm()">Cerrar</button></div>';
    }
    if(!state.chart.name || !hist[state.chart.name]) state.chart.name = names[0];
    var data = hist[state.chart.name];
    var pts = Object.keys(data).sort().slice(-12).map(function(wk){ return {wk:wk, v:data[wk]}; });
    var all = Object.keys(data).sort().map(function(wk){ return data[wk]; });
    var best = Math.max.apply(null, all), change = all[all.length - 1] - all[0];
    var sel = state.chart.sel >= 0 && state.chart.sel < pts.length ? state.chart.sel : pts.length - 1;
    var opts = names.map(function(n){ return '<option' + (n === state.chart.name ? " selected" : "") + '>' + esc(n) + '</option>'; }).join("");
    return '<h3>Progreso por ejercicio</h3>' +
      '<div class="field"><label>Ejercicio</label><select class="sel" onchange="WS.chartExercise(this.value)">' + opts + '</select></div>' +
      '<div class="stats">' +
        '<div><small>Mejor marca</small><b>' + fmtNum(best) + ' kg</b></div>' +
        '<div><small>Desde el inicio</small><b class="' + (change > 0.005 ? "up" : "") + '">' + (change > 0.005 ? "+" : "") + fmtNum(change) + ' kg</b></div>' +
        '<div><small>Semanas</small><b>' + all.length + '</b></div>' +
      '</div>' +
      '<div class="ch-readout" id="chReadout">Semana ' + esc(weekRangeLabel(pts[sel].wk)) + ': <b>' + fmtNum(pts[sel].v) + ' kg</b></div>' +
      chartSvg(pts) +
      (pts.length === 1 ? '<p class="desc center">Cargá el peso otra semana para ver la línea de progreso.</p>' : '<p class="desc center">Peso máximo de cada semana · últimas ' + pts.length + ' semanas</p>') +
      '<div class="btn-row"><button class="btn btn-ghost" onclick="WS.closeConfirm()">Cerrar</button></div>';
  }

  WS.loadSample = async function(){

          var h = 0; for(var c = 0; c < ex.name.length; c++) h = (h * 31 + ex.name.charCodeAt(c)) % 997;
          var base = 10 + (h % 11) * 5;
          var kg = base + Math.floor((6 - w) * (h % 3 === 0 ? 1.25 : 2.5) / 1.25) * 1.25;
          if(w === 4 && di === 0) return;
          dc[ex.id] = {done:true, peso: fmtNum(kg), n: ex.name, doneAt: Date.now() - w * 6e8 + i * 1e5};

  // ---------- descargas ----------
  // Dentro de claude.ai usa la capacidad "downloads"; como app instalada, una descarga normal.
  var dlPromise = null;
  function getDownloads(){
    if(!(window.claude && typeof window.claude.use === "function")) return Promise.resolve(null);
    if(!dlPromise) dlPromise = window.claude.use("downloads").catch(function(){ return null; });
    return dlPromise;
  }
  async function saveFile(name, blob){
    var dl = await getDownloads();
    if(dl){
      try{ await dl.save({filename:name, data:blob}); return "saved"; }
      catch(e){
        if(e && e.code === "declined") return "declined";
        if(e && e.code === "rate_limited"){ toast("Esperá un momento y probá de nuevo"); return "busy"; }
      }
    }
    var url = URL.createObjectURL(blob), a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(function(){ URL.revokeObjectURL(url); }, 3000);
    return "saved";
  }

  // ---------- informe PDF ----------
  function generateWeekPDF(){
    var wk = getWeekKey(), routine = state.config.routine, wc = state.checks[wk] || {};
    var doc = new window.jspdf.jsPDF({unit:"pt", format:"a4"});
    var pw = doc.internal.pageSize.getWidth(), ph = doc.internal.pageSize.getHeight();
    var m = 42, y = 54;
    doc.setFont("helvetica", "bold"); doc.setFontSize(18); doc.setTextColor(20, 20, 20);
    doc.text("Workout Streak", m, y); y += 20;
    doc.setFont("helvetica", "normal"); doc.setFontSize(11); doc.setTextColor(110, 110, 110);
    doc.text("Resumen semanal — " + activeEntry().name + " — semana " + weekRangeLabel(wk), m, y);
    doc.setTextColor(20, 20, 20); y += 20;
    var ws = weekStatus(wk), adh = recentAdherence(), info = computeStreakInfo();
    var parts = ["Sesiones: " + ws.done + " de " + ws.planned + " (meta " + ws.goal + ")"];
    if(adh) parts.push("Adherencia " + adh.weeks + " sem.: " + adh.pct + "% (" + adh.label + ")");
    parts.push("Racha: " + info.streak + (info.streak === 1 ? " semana" : " semanas"));
    parts.push("Puntos de la semana: " + weekPoints(wk));
    if(ws.deload) parts.push("Semana de descarga");
    doc.setFontSize(10);
    var sl = doc.splitTextToSize(parts.join("  |  "), pw - m * 2);
    doc.text(sl, m, y); y += sl.length * 13 + 16;
    DAY_ORDER.forEach(function(k){
      var d = routine[k];
      var needed = d.rest ? 40 : 24 + (d.exercises.length || 1) * 16;
      if(y + needed > ph - m){ doc.addPage(); y = 54; }
      doc.setFont("helvetica", "bold"); doc.setFontSize(13); doc.setTextColor(20, 20, 20);
      doc.text(DAY_NAME[k] + (d.rest ? " — Descanso" : " — " + d.title + (d.focus ? " (" + d.focus + ")" : "")), m, y); y += 17;
      doc.setFont("helvetica", "normal"); doc.setFontSize(10);
      if(d.rest){ var nl = doc.splitTextToSize(d.note || "Descanso.", pw - m * 2); doc.text(nl, m, y); y += nl.length * 13 + 12; return; }
      if(!d.exercises.length){ doc.setTextColor(130, 130, 130); doc.text("Sin ejercicios cargados.", m, y); doc.setTextColor(20, 20, 20); y += 18; return; }
      var dc = wc[k] || {};
      d.exercises.forEach(function(ex){
        if(y > ph - m - 16){ doc.addPage(); y = 54; }
        var st = dc[ex.id] || {};
        var bs = 8, bx = m, by = y - bs + 1;
        doc.setDrawColor(160, 160, 160); doc.setLineWidth(0.7); doc.rect(bx, by, bs, bs);
        if(st.done){
          doc.setDrawColor(36, 152, 206); doc.setLineWidth(1.1);
          doc.line(bx + 1.5, by + 4.2, bx + 3.3, by + 6.3); doc.line(bx + 3.3, by + 6.3, bx + 7, by + 1.5);
        }
        var line = ex.name + "   " + ex.series + "x" + ex.reps + (st.peso ? "  —  " + st.peso + " kg" : "");
        var wr = doc.splitTextToSize(line, pw - m * 2 - bs - 6);
        doc.text(wr, bx + bs + 6, y); y += wr.length * 13 + 3;
      });
      y += 10;
    });
    doc.setFontSize(8); doc.setTextColor(150, 150, 150);
    doc.text("Generado con Workout Streak · Creado por Sentidodigital", m, ph - 24);
    return {doc:doc, weekKey:wk};
  }

  // ---------- importar rutina desde texto ----------
  state.importText = "";

  var IMPORT_SAMPLE = "Lunes - Torso 1 (Empuje / Fuerza)\nPress banca plano 4x6-8\nRemo bajo en polea 4x8-10\nVuelos laterales 4x12-15\n\nMartes - Pierna 1 (Cuádriceps)\nSentadilla Smith 4x8-10\nPrensa 45° 3x10-12\nPlancha frontal 3x45s\n\nMiércoles: descanso";
  var DAY_ALIASES = {lunes:"lunes",lun:"lunes",martes:"martes",mar:"martes",miercoles:"miercoles",mier:"miercoles",mie:"miercoles",jueves:"jueves",jue:"jueves",viernes:"viernes",vie:"viernes",sabado:"sabado",sab:"sabado",domingo:"domingo",dom:"domingo"};

  function normTxt(t){ return String(t || "").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/\s+/g, " ").trim(); }
  function capFirst(t){ t = t.trim(); return t ? t.charAt(0).toUpperCase() + t.slice(1) : t; }
  function libMatch(name){
    var n = normTxt(name);
    for(var i = 0; i < LIBRARY.length; i++){
      for(var j = 0; j < LIBRARY[i].items.length; j++){
        if(normTxt(LIBRARY[i].items[j]) === n) return {name:LIBRARY[i].items[j], s:LIBRARY[i].s, r:LIBRARY[i].r};
      }
    }
    return null;
  }

  function parseDayHeader(line){
    var m = /^\s*(?:[#*\-•·]+\s*)?(?:dia\s+)?([a-z]+)\b\.?\s*(.*)$/.exec(normTxt(line));
    if(!m || !DAY_ALIASES[m[1]]) return null;
    var key = DAY_ALIASES[m[1]];
    // texto original después del nombre del día
    var raw = line.replace(/^\s*(?:[#*\-•·]+\s*)?/, "");
    var words = raw.split(/\s+/);
    var skip = normTxt(words[0]) === "dia" ? 2 : 1;
    var rest = words.slice(skip).join(" ").replace(/^[\s.:\-–—|,]+/, "").replace(/[\s:]+$/, "");
    // si después del día viene una serie (ej. "Lunes press banca 4x8") no es encabezado
    if(/\d+\s*(?:[x×*]|series?)\s*\S/i.test(rest)) return null;
    var title = rest, focus = "";
    var pm = /^(.*?)\s*\(([^)]*)\)\s*$/.exec(rest);
    if(pm){ title = pm[1]; focus = pm[2]; }
    else {
      var sp = rest.split(/\s+[-–—|]\s+|\s*:\s+/);
      if(sp.length > 1){ title = sp[0]; focus = sp.slice(1).join(" / "); }
    }
    title = title.replace(/[\s\-–—:|]+$/, "").trim();
    var isRest = /^(descanso|libre|off|rest)\b/.test(normTxt(title)) || /^descanso\b/.test(normTxt(focus));
    return {key:key, title:capFirst(title), focus:capFirst(focus), rest:isRest};
  }

  function parseExercise(line){
    var t = line.replace(/^\s*(?:[-–—•·*>]+|\d{1,2}\s*[.)\-]|[a-z]\))\s*/i, "").trim();
    if(!t || !/[a-záéíóúñü]/i.test(t)) return null;
    var re = /^(.*?)[\s:,;\-–—|]*\b(\d{1,2})\s*(?:[x×*]|series?\s*(?:de|x|×)?)\s*(.+)$/i;
    var m = re.exec(t);
    var name, series, reps, guessed = false;
    if(m && m[1].trim()){
      name = m[1]; series = m[2];
      reps = m[3].replace(/\s*(?:reps?|repeticiones?)\b\.?/i, " ").replace(/\s+/g, " ").trim();
      if(!reps) reps = "10-12";
    } else {
      name = t; guessed = true;
    }
    name = name.replace(/[\s:,;\-–—|]+$/, "").trim();
    if(!name) return null;
    var lib = libMatch(name);
    if(lib) name = lib.name; else name = capFirst(name);
    if(guessed){ var d = lib ? {s:lib.s, r:lib.r} : libDefaults(name); series = d.s; reps = d.r; }
    return {name:name, series:series, reps:reps, guessed:guessed};
  }

  function parseImport(text){
    var days = {}, order = [], cur = null, orphan = [];
    String(text || "").split(/\r?\n/).forEach(function(raw){
      var line = raw.trim();
      if(!line) return;
      var h = parseDayHeader(line);
      if(h){
        if(!days[h.key]){ order.push(h.key); days[h.key] = {title:h.title, focus:h.focus, rest:h.rest, exercises:[]}; }
        else { if(h.title) days[h.key].title = h.title; if(h.focus) days[h.key].focus = h.focus; if(h.rest) days[h.key].rest = true; }
        cur = h.key; return;
      }
      var ex = parseExercise(line);
      if(!ex) return;
      if(cur){
        if(/^(descanso|libre|off)\b\.?$/.test(normTxt(line))){ days[cur].rest = true; return; }
        days[cur].exercises.push(ex);
      } else orphan.push(ex);
    });
    // sin días escritos: todo va al día que está abierto en el editor
    if(!order.length && orphan.length){
      var k = state.editDay, cd = state.editDraft[k];
      order.push(k);
      days[k] = {title:(!cd.rest && cd.title) ? cd.title : "Entrenamiento", focus:cd.rest ? "" : (cd.focus || ""), rest:false, exercises:orphan, implicit:true};
      orphan = [];
    }
    order.forEach(function(k){
      var d = days[k];
      if(d.exercises.length) d.rest = false;
      if(!d.rest && !d.title) d.title = "Entrenamiento";
    });
    order.sort(function(a, b){ return DAY_ORDER.indexOf(a) - DAY_ORDER.indexOf(b); });
    return {days:days, order:order, orphan:orphan};
  }

  function importPreviewHtml(){

    var guessedAny = false;
    var html = res.order.map(function(k){
      var d = res.days[k];
      if(d.rest) return '<div class="imp-day"><div class="imp-day-h"><b>' + DAY_NAME[k] + '</b><span>Descanso</span></div></div>';
      var exs = d.exercises.map(function(e){

        return '<div class="imp-ex' + (e.guessed ? " warn" : "") + '"><span>' + esc(e.name) + '</span><small>' + esc(e.series) + ' × ' + esc(e.reps) + (e.guessed ? " *" : "") + '</small></div>';
      }).join("") || '<div class="imp-day-f">Sin ejercicios todavía.</div>';
      return '<div class="imp-day"><div class="imp-day-h"><b>' + DAY_NAME[k] + ' · ' + esc(d.title) + '</b><span>' + d.exercises.length + ' ejercicio' + (d.exercises.length === 1 ? "" : "s") + '</span></div>' +
        (d.focus ? '<div class="imp-day-f">' + esc(d.focus) + '</div>' : '') + exs + '</div>';
    }).join("");
    var notes = "";
    if(guessedAny) notes += '<div class="imp-note">* No tenía series × reps escritas: se completaron con un valor sugerido. Podés corregirlas después en el editor.</div>';
    if(res.days[res.order[0]] && res.days[res.order[0]].implicit) notes += '<div class="imp-note">No encontré nombres de días, así que todo va al ' + DAY_NAME[res.order[0]] + ' (el día abierto en el editor).</div>';
    if(res.orphan.length) notes += '<div class="imp-note">' + res.orphan.length + ' ejercicio(s) antes del primer día quedaron afuera. Poné el día arriba de ellos.</div>';
    return '<div class="imp-prev">' + html + '</div>' + notes;
  }

  function importHtml(){
    return '<h3>Importar rutina desde texto</h3>' +
      '<p class="desc">Escribí o pegá tu rutina. Cada día empieza con su nombre y abajo van los ejercicios, uno por renglón.</p>' +
      '<textarea class="imp-text" id="impText" placeholder="Lunes - Torso 1 (Empuje)&#10;Press banca plano 4x6-8&#10;Remo bajo en polea 4x8-10&#10;&#10;Martes - Pierna 1&#10;Sentadilla Smith 4x8-10" oninput="WS.importInput(this.value)">' + esc(state.importText) + '</textarea>' +
      '<div class="imp-help">Formato: <code>Ejercicio 4x8-10</code>. También sirve <code>4 series de 10</code>, <code>3x45s</code> o <code>3x al fallo</code>. Lo que va entre paréntesis en el día es el enfoque. Escribí <code>descanso</code> al lado del día para marcarlo libre. ' +
      '<button class="imp-sample" onclick="WS.importSample()">Cargar ejemplo</button></div>' +
      '<div class="field"><label>Días que no están en el texto</label><div class="daytype-toggle">' +
        '<div class="daytype-opt' + (!state.importRestOthers ? " active" : "") + '" onclick="WS.importRestMode(false)">Dejarlos como están</div>' +
        '<div class="daytype-opt' + (state.importRestOthers ? " active" : "") + '" onclick="WS.importRestMode(true)">Pasarlos a descanso</div></div></div>' +
      '<div id="impPreview">' + importPreviewHtml() + '</div>' +
      '<div class="btn-row"><button class="btn btn-ghost" onclick="WS.backToEditor()">Volver</button><button class="btn btn-primary" id="impApply" onclick="WS.applyImport()">Pasar al editor</button></div>';
  }

  WS.openImport = function(){ syncDraft(); openOverlay(importHtml()); };
  WS.importInput = function(v){ state.importText = v; document.getElementById("impPreview").innerHTML = importPreviewHtml(); };
  WS.importSample = function(){ state.importText = IMPORT_SAMPLE; openOverlay(importHtml()); };
  WS.importRestMode = function(on){
    var ta = document.getElementById("impText"); if(ta) state.importText = ta.value;
    state.importRestOthers = on; openOverlay(importHtml());
  };
  WS.applyImport = function(){
    var ta = document.getElementById("impText"); if(ta) state.importText = ta.value;
    var res = parseImport(state.importText);
    if(!res.order.length){ toast("Escribí al menos un día con sus ejercicios"); return; }
    var total = 0;
    res.order.forEach(function(k){
      var nd = res.days[k], old = state.editDraft[k] || {exercises:[]};
      // se reusan los ids de los ejercicios que ya estaban, así no se pierde el historial de pesos
      var pool = (old.exercises || []).slice();
      var exercises = nd.exercises.map(function(e){
        var idx = pool.findIndex(function(o){ return normTxt(o.name) === normTxt(e.name); });
        var id = idx >= 0 ? pool.splice(idx, 1)[0].id : uid();
        return {id:id, name:e.name, series:e.series, reps:e.reps};
      });
      total += exercises.length;
      if(nd.rest) state.editDraft[k] = {title:"Descanso", focus:"", rest:true, exercises:[], note:old.note || "Descanso."};
      else state.editDraft[k] = {title:nd.title, focus:nd.focus, rest:false, note:"", exercises:exercises};
    });
    if(state.importRestOthers){
      DAY_ORDER.forEach(function(k){
        if(res.order.indexOf(k) < 0) state.editDraft[k] = {title:"Descanso", focus:"", rest:true, exercises:[], note:"Descanso."};
      });
    }
    var firstTrain = res.order.filter(function(k){ return !state.editDraft[k].rest; })[0];
    state.editDay = firstTrain || res.order[0];
    state.importText = "";
    openOverlay(editorHtml());
    toast(total + " ejercicio" + (total === 1 ? "" : "s") + " cargados. Revisá y tocá Guardar cambios");
  };

  WS.cancelEdit = function(){ state.editDraft = null; closeOverlay(); };
  WS.saveEdit = async function(){
    syncDraft();
    var entry = activeEntry();
    entry.routine = state.editDraft;
    if(state.editName.trim()) entry.name = state.editName.trim();
    state.config.routine = entry.routine;
    var g = parseInt(state.editGoal, 10);
    state.config.goal = (isNaN(g) || g < 1) ? null : g;
    var ok = await saveConfig();
    state.editDraft = null; closeOverlay(); render();
    toast(ok ? "Rutina guardada" : "No se pudo guardar, intentá de nuevo");
  };

  WS.installApp = async function(){
    if(!state.deferredPrompt) return;
    state.deferredPrompt.prompt();
    await state.deferredPrompt.userChoice;
    state.deferredPrompt = null; state.canInstall = false; render();
  };

  window.WS = WS;

  window.addEventListener("beforeinstallprompt", function(e){ e.preventDefault(); state.deferredPrompt = e; state.canInstall = true; if(state.config) render(); });
  window.addEventListener("appinstalled", function(){ state.canInstall = false; state.deferredPrompt = null; render(); });
  document.getElementById("overlay").addEventListener("click", function(e){ if(e.target.id === "overlay" && !state.editDraft && state.ob.mode === "onboard") closeOverlay(); });

  (async function init(){
    await loadAll(); render();
    if(state.pendingToast){ toast(state.pendingToast); state.pendingToast = null; }
    syncPro();
    document.addEventListener("visibilitychange", function(){ if(document.visibilityState === "visible") syncPro(); });
  })();
})();
</script>
</body>
</html>
